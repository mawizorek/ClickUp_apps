<!doctype html>
<!-- INFRASTRUCTURE: modular router shell + pages/ partials (hash router, theme spine). Pages-hosted only, not file:// capable. -->
<!-- Placed UNFORKED from template-app v5 (PR #300). Everything app-specific rides in through the APP_* constants below.
     If this app needs something the template cannot express, change the TEMPLATE — that is Michael's call, not a local special-case. -->
<!-- THEME: APP_THEME is a JOIN slug from shared/themes/_themes.json (color x typography x forms x spacing).
     DEFAULT_COLOR is a COLOR slug from shared/themes/_index.json. They are NOT interchangeable:
     passing a color slug to applyTheme() faults. Nothing here is authored — both values are borrowed.
     TO RESKIN THE WHOLE APP: change APP_THEME to any slug in _themes.json. One line, nothing else. -->
<!-- CSS SPLIT (v1.1): styles.css = the template baseline. app.css = objects this app added.
     By ORIGIN, not size, so a template re-sync and app work never fight over one file. -->
<!-- JS SPLIT (v1.3): zip.js = the container writer. gh.js = the network. names.js = export-name
     transforms (pure). view.js = every rendered string. app.js = the job reducer + listeners.
     Each is a lane, and each stays under the 15KB line on its own. -->
<html lang="en" data-theme="maw-dark-utility" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#333740">
<meta name="robots" content="noindex, nofollow">
<!-- EARLY THEME: set the saved color before first paint so a saved non-default color paints instantly. -->
<script>try{var t=localStorage.getItem("app_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>git-grab</title>
<meta name="description" content="Paste a public GitHub folder URL, get back a zip of that folder and everything under it.">
<meta property="og:title" content="git-grab">
<meta property="og:description" content="Paste a public GitHub folder URL, get back a zip of that folder and everything under it.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mawizorek.github.io/ClickUp_apps/git-grab/">
<meta property="og:image" content="https://mawizorek.github.io/ClickUp_apps/git-grab/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="git-grab">
<meta name="twitter:description" content="Paste a public GitHub folder URL, get back a zip of that folder and everything under it.">
<meta name="twitter:image" content="https://mawizorek.github.io/ClickUp_apps/git-grab/og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128230;</text></svg>">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<!-- THEME SPINE: static themes.css = instant themed first paint (color); resolve.js composes all 4 vectors. -->
<link rel="stylesheet" href="../shared/themes/themes.css">
<link rel="stylesheet" href="./styles.css?v=7">
<link rel="stylesheet" href="./app.css?v=7">
</head>
<body>
<div id="access-gate" hidden>
  <div class="gate-card">
    <h1 id="gate-title">Under maintenance</h1>
    <p id="gate-msg">This app is being updated. Check back soon.</p>
    <form id="gate-form">
      <input id="gate-code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" autofocus aria-label="Access code" placeholder="0426">
      <button type="submit">Enter</button>
    </form>
  </div>
</div>

<a class="skip-link" href="#view">Skip to content</a>
<header id="appHeader"></header>
<main id="view" tabindex="-1"></main>
<footer id="appFooter"></footer>

<noscript>This app needs JavaScript enabled to run.</noscript>

<script src="../shared/themes/resolve.js"></script>
<script src="./chrome.js?v=7"></script>
<script src="./zip.js?v=7"></script>
<script src="./gh.js?v=7"></script>
<script src="./names.js?v=7"></script>
<script src="./view.js?v=7"></script>
<script src="./app.js?v=7"></script>
<script>
(function () {
  /* ==== APP CONSTANTS ==== */
  var APP_NAME    = "git-grab";
  var APP_VERSION = "v1.3";
  var APP_PR      = 745;                  // merged PR that shipped this version (read back, not guessed)
  var APP_THEME   = "soft-utility";       // JOIN slug (_themes.json). CHANGE THIS ONE LINE TO RESKIN.
  var DEFAULT_COLOR = "maw-dark-utility"; // COLOR slug (_index.json) — lightweight fallback if the join cannot load
  var DEFAULT_PAGE  = "home";
  var NAV = [
    { route: "home",  label: "Grab a folder" },
    { route: "test",  label: "Self test" },
    { route: "about", label: "About" }
  ];
  /* ======================= */

  /* ---- THEME: the join sets every token inline; the picker overrides COLOR only. ---- */
  if (window.THEMES && THEMES.applyTheme) {
    THEMES.applyTheme(APP_THEME).then(function () {
      var saved = null; try { saved = localStorage.getItem("app_theme"); } catch (e) {}
      if (saved && THEMES.apply) THEMES.apply(saved, { silent: true });
    });
  } else {
    document.documentElement.setAttribute("data-theme", DEFAULT_COLOR);
  }

  /* ---- ACCESS GATE ---- */
  (function gate() {
    var FALLBACK = { access: "open", code: "0426",
      coverTitle: "git-grab", coverMessage: "Enter the code to continue.",
      downTitle: "Temporarily offline", downMessage: "git-grab is currently unavailable." };
    var SS = "gate_ok";
    function focusCode() {
      var c = document.getElementById("gate-code");
      if (c) { try { c.focus(); c.select(); } catch (e) {} }
    }
    function apply(cfg) {
      var g = document.getElementById("access-gate");
      if (cfg.access === "open" || sessionStorage.getItem(SS) === "1") { g.remove(); return; }
      g.hidden = false;
      var form = document.getElementById("gate-form");
      if (cfg.access === "down") {
        document.getElementById("gate-title").textContent = cfg.downTitle || FALLBACK.downTitle;
        document.getElementById("gate-msg").textContent  = cfg.downMessage || FALLBACK.downMessage;
        form.style.display = "none"; return;
      }
      document.getElementById("gate-title").textContent = cfg.coverTitle || FALLBACK.coverTitle;
      document.getElementById("gate-msg").textContent  = cfg.coverMessage || FALLBACK.coverMessage;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (document.getElementById("gate-code").value.trim() === String(cfg.code)) {
          sessionStorage.setItem(SS, "1"); g.remove();
        } else { var c = document.getElementById("gate-code"); c.value = ""; c.focus(); }
      });
      focusCode(); setTimeout(focusCode, 80);
    }
    fetch("./config.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (cfg) { try { localStorage.setItem("app_config", JSON.stringify(cfg)); } catch (e) {} apply(cfg); })
      .catch(function () { var c = null; try { c = JSON.parse(localStorage.getItem("app_config")); } catch (e) {} apply(c || FALLBACK); });
  })();

  /* ---- CHROME ---- */
  Chrome.init({
    appName: APP_NAME, version: APP_VERSION, pr: APP_PR,
    nav: NAV, defaultTheme: DEFAULT_COLOR, logo: "\uD83D\uDCE6",
    sources: [ { label: "Source \u2197", href: "https://github.com/mawizorek/ClickUp_apps/tree/main/git-grab" } ]
  });

  /* ---- PAGE BEHAVIOUR ----
     The router injects partials with innerHTML, and a script tag inserted that way NEVER executes
     (HTML spec, not a quirk). So any page needing behaviour is hooked here, after render. Two
     pages use it, which is why it is one mechanism rather than two copies. */
  function afterRender(route) {
    if (route === "home" && window.GRAB) { GRAB.mount(); return; }
    if (route !== "test") return;

    var btn = document.getElementById("runSelftest");
    var out = document.getElementById("selftestOut");
    if (!btn || !out || !window.ZIP) return;

    btn.addEventListener("click", function () {
      btn.disabled = true;
      out.innerHTML = '<p class="muted">Running\u2026</p>';

      /* TWO SUITES, ONE BUTTON. NAMES is synchronous and pure; ZIP is async and builds a real
         archive. "Run the self test" has to mean all of it — a second button is a second thing
         to forget, and the rename layer is exactly the kind of quiet logic that needs the check
         to be one click away. */
      var nm = (window.NAMES && NAMES.selftest) ? NAMES.selftest() : { ok: true, results: [] };

      ZIP.selftest().then(function (r) {
        var all = nm.results.concat(r.results);
        var pass = nm.ok && r.ok;
        var rows = all.map(function (line) {
          var good = line.indexOf("PASS") === 0;
          return '<tr><td>' + (good ? '<span class="badge good">pass</span>' : '<span class="badge bad">fail</span>') +
                 '</td><td class="mono">' + line.slice(6).trim().replace(/</g, "&lt;") + '</td></tr>';
        }).join("");
        out.innerHTML =
          '<div class="callout"><strong>' + (pass ? "\u2705 All internal checks passed." : "\u274c Something failed \u2014 see below.") +
          '</strong> ' + nm.results.length + ' name checks, ' + r.results.length + ' zip checks. ' +
          'Compression: <code>' + r.method + '</code>. Archive: <code>' + r.size + '</code> bytes.</div>' +
          '<table class="tbl"><thead><tr><th>Result</th><th>Check</th></tr></thead><tbody>' + rows + '</tbody></table>' +
          '<div class="btn-row"><a class="btn btn-primary" href="' + r.url + '" download="git-grab-selftest.zip">Download the sample zip</a></div>' +
          '<p class="muted">The name checks above are the whole truth about renaming: they run in memory ' +
          'and either pass or fail. The zip checks are not \u2014 nothing in a tab can prove an OS extractor ' +
          'accepts a file. Open the sample in Finder or Explorer. You should see four files, ' +
          'with <code>data.txt</code> inside <code>nested/deep/</code> and the caf\u00e9 filename intact.</p>';
        btn.disabled = false;
      }).catch(function (e) {
        out.innerHTML = '<div class="callout"><strong>\u274c The test threw.</strong><br><code>' +
          String(e && e.message || e).replace(/</g, "&lt;") + '</code></div>';
        btn.disabled = false;
      });
    });
  }

  /* ---- ROUTER: hash -> pages/<route>.html injected into #view ---- */
  var view = document.getElementById("view");
  var routes = NAV.map(function (n) { return n.route; });
  function render(route) {
    if (routes.indexOf(route) === -1) route = DEFAULT_PAGE;
    fetch("./pages/" + route + ".html", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (html) {
        view.innerHTML = html; Chrome.setActive(route); view.focus(); window.scrollTo(0, 0);
        afterRender(route);
      })
      .catch(function () {
        view.innerHTML = '<section class="page"><h1>Page not found</h1>' +
          '<p class="muted">No page matches <code>#' + route + '</code>.</p></section>';
      });
  }
  function current() { return (location.hash || "").replace(/^#/, "") || DEFAULT_PAGE; }
  window.addEventListener("hashchange", function () { render(current()); });
  render(current());
})();
</script>
</body>
</html>
