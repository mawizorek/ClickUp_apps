# Deploy the Inciardi Collection worker — from a BUTTON, no terminal.
#
# WHY THIS EXISTS: wrangler needs Node and a shell. iOS has neither. Michael works from a
# phone, so a CLI runbook is a runbook he cannot execute. This moves the deploy onto a
# surface he actually has: the "Run workflow" button in the GitHub web UI.
#
# WHY NOT the Cloudflare dashboard's worker editor (also phone-doable): it puts the worker
# SOURCE in the dashboard, so git and the running worker become two sources of truth that
# drift. That is precisely the disease this app was rebuilt to cure. Git stays canonical;
# CI deploys from it.
#
# workflow_dispatch ONLY — no push trigger. The front-end needs no deploy at all (Pages
# serves it ~60s after a commit); only `worker/` changes need this. And unattended
# auto-deploy of a key-authenticated write API on every commit is not something you want.
#
# ============================================================================
# 🔍 WHY THIS FILE LOOKS LIKE A DIAGNOSTIC HARNESS RATHER THAN A DEPLOY
#
# Runs 1 and 2 both died with "The process '/usr/local/bin/npx' failed with exit code 1",
# which says nothing. Two separate causes:
#
#   a) cloudflare/wrangler-action swallows wrangler's real error and reports its own exit
#      code instead (cloudflare/wrangler-action#360). So the actual message only ever
#      existed in the raw log. → THE ACTION IS GONE. We call wrangler directly and the
#      error is ours to capture.
#
#   b) My run-2 "fix" echoed diagnostics to stdout — but the mobile annotation panel only
#      renders ::error:: and failed actions, and `continue-on-error` suppressed even those.
#      So run 2 looked identical to run 1 and told him nothing. → EVERYTHING NOW WRITES TO
#      $GITHUB_STEP_SUMMARY, which renders as a page you can read on a phone.
#
# Rule this file now follows: a diagnostic that reports somewhere the reader cannot see is
# not a diagnostic.
# ============================================================================

name: Deploy inciardi-collection worker

on:
  workflow_dispatch:
    inputs:
      database_id:
        description: "Override the D1 database id (leave blank — wrangler.toml already has it)"
        required: false
        type: string

permissions:
  contents: read          # least privilege: this job reads the repo and nothing else

concurrency:
  group: deploy-inciardi-collection
  cancel-in-progress: false   # never race two deploys of the same worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inciardi-collection
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # NOTE: no version pin. The previous commit pinned "4.28.1" — a number I invented and
      # never verified. If that version does not exist, `npx wrangler@4.28.1` fails instantly
      # with exit code 1, which is exactly the symptom being debugged, so the pin may have
      # been a second cause stacked on the first. `wrangler@4` tracks the current major
      # without asserting a specific release exists.
      WR: "npx --yes wrangler@4"

    steps:
      - uses: actions/checkout@v4

      - name: Preflight · secrets present?
        run: |
          {
            echo "## Preflight"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          # Lengths only, never values. A ~40-char token and a 32-char hex account id are the
          # expected shapes; wildly different lengths usually mean the two got swapped.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or missing."
            echo "- ❌ \`CLOUDFLARE_API_TOKEN\` **empty or missing**" >> "$GITHUB_STEP_SUMMARY"; FAIL=1
          else
            echo "- ✅ token present (${#CLOUDFLARE_API_TOKEN} chars)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or missing."
            echo "- ❌ \`CLOUDFLARE_ACCOUNT_ID\` **empty or missing**" >> "$GITHUB_STEP_SUMMARY"; FAIL=1
          else
            echo "- ✅ account id present (${#CLOUDFLARE_ACCOUNT_ID} chars)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $FAIL

      - name: Resolve the D1 database id
        run: |
          FILE=wrangler.toml
          ID="${{ inputs.database_id }}"
          if [ -z "$ID" ]; then ID="${{ vars.INCIARDI_DB_ID }}"; fi

          if grep -q PASTE_DATABASE_ID_HERE "$FILE"; then
            if [ -z "$ID" ]; then
              echo "::error::wrangler.toml holds the placeholder and no id was supplied."
              exit 1
            fi
            sed -i "s|PASTE_DATABASE_ID_HERE|$ID|" "$FILE"
          elif [ -n "$ID" ]; then
            sed -i "s|^database_id = .*|database_id = \"$ID\"|" "$FILE"
            echo "- ℹ️ overrode the committed database id for this run" >> "$GITHUB_STEP_SUMMARY"
          fi

          BOUND=$(grep '^database_id' "$FILE" | sed 's/.*"\(.*\)".*/\1/')
          echo "- ✅ bound to database \`${BOUND:0:8}…\`" >> "$GITHUB_STEP_SUMMARY"
          if grep -q PASTE_DATABASE_ID_HERE "$FILE"; then
            echo "::error::Still the placeholder. A worker bound to nothing looks like it worked."
            exit 1
          fi

      # THE DIAGNOSTIC THAT MATTERS. `whoami` prints the token's permission table — the only
      # thing that separates "bad token" from "token missing a scope" from "config is wrong."
      # Leading suspect: deploying a worker WITH a D1 binding needs D1 edit permission, and
      # the Edit-Cloudflare-Workers template has not reliably included it. A dry-run never
      # touches the account, so it would pass while the real deploy 403s.
      #
      # Reports, never blocks — but the output goes somewhere readable this time.
      - name: Preflight · whoami (token permissions)
        run: |
          set +e
          $WR whoami > who.txt 2>&1
          RC=$?
          {
            echo ""
            echo "## \`wrangler whoami\` — exit $RC"
            echo ""
            echo '```'
            cat who.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $RC -ne 0 ]; then
            echo "::error::whoami failed — the token itself is the problem. See the run summary."
          fi
          exit 0

      # Validates wrangler.toml, the entrypoint and every binding WITHOUT touching the
      # account. A config error surfaces HERE with a real message.
      - name: Preflight · dry-run build
        run: |
          set +e
          $WR deploy --dry-run > dry.txt 2>&1
          RC=$?
          {
            echo ""
            echo "## \`deploy --dry-run\` — exit $RC"
            echo ""
            echo '```'
            tail -40 dry.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $RC -ne 0 ]; then
            echo "::error::The config does not build. This is not an auth problem. See the run summary."
          fi
          exit 0

      # THE DEPLOY, run directly. No wrapper, so wrangler's real error is ours to surface:
      # tee'd into the summary AND pushed into an annotation.
      - name: Deploy
        run: |
          set +e
          $WR deploy > out.txt 2>&1
          RC=$?
          {
            echo ""
            echo "## \`wrangler deploy\` — exit $RC"
            echo ""
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat out.txt
          if [ $RC -ne 0 ]; then
            # First real error line into the annotation panel, which is what shows on mobile.
            MSG=$(grep -m1 -E 'ERROR|error|Error' out.txt | head -c 400)
            echo "::error::wrangler deploy failed: ${MSG:-see the run summary}"
            exit $RC
          fi
          URL=$(grep -m1 -oE 'https://[a-z0-9.-]*workers\.dev' out.txt)
          {
            echo ""
            echo "### ✅ Deployed"
            echo ""
            echo "**Worker URL:** \`${URL:-check the log above}\`"
            echo ""
            echo "Next, once only:"
            echo "1. Cloudflare dashboard → this worker → Settings → Variables and Secrets"
            echo "2. Add secret \`WRITE_KEY\` — a long random string, not a word"
            echo "3. Open the app → ⚙ → paste the worker URL + that key"
          } >> "$GITHUB_STEP_SUMMARY"
