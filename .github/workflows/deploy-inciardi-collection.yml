# Deploy the Inciardi Collection worker.
#
# AUTOMATIC on any push to main that touches the worker. Manual button still available.
#
# WHY THE BUTTON EXISTS AT ALL: wrangler needs Node and a shell. iOS has neither. Michael
# works from a phone, so a CLI runbook is a runbook he cannot execute. The "Run workflow"
# button was the surface he actually has — and it is still here for a forced redeploy.
#
# WHY NOT the Cloudflare dashboard's worker editor (also phone-doable): it puts the worker
# SOURCE in the dashboard, so git and the running worker become two sources of truth that
# drift. That is precisely the disease this app was rebuilt to cure. Git stays canonical;
# CI deploys from it.
#
# ============================================================================
# 🔴 WHY THIS IS NOW A PUSH TRIGGER, AND WHY THE ORIGINAL REASON EXPIRED
#
# This started as `workflow_dispatch` ONLY, on this stated reasoning:
#   "unattended auto-deploy of a key-authenticated write API on every commit is not
#    something you want."
#
# That was sound on 2026-07-29, when WRITE_KEY was a dashboard secret living OUTSIDE git: an
# auto-deploy could not touch it, and a deploy was a rare, deliberate act.
#
# It expired on 2026-07-30, twice over:
#   1. The key now ships in `wrangler.toml` under [vars] and in the public front-end bundle.
#      There is no secret for an automatic deploy to leak that a reader of the repo does not
#      already have. The premise of the caution is gone.
#   2. Michael, on the third manual run in one afternoon: "why do i hav to keep running the
#      deploy…?" Every one of those runs shipped code that was ALREADY MERGED TO MAIN. A
#      required manual step whose only possible outcome is "apply what main already says" is
#      not a safety gate, it is a chore with a failure mode — because the moment someone
#      forgets it, the front end is calling routes the worker does not have. Which is exactly
#      what v4 did.
#
# PATH FILTER IS THE WHOLE POINT. This fires ONLY when the worker's own inputs change:
# `worker/**`, `wrangler.toml`, or this file. Front-end changes (index.html, app.js, core.js,
# styles.css, pages/) need no deploy — GitHub Pages serves them ~60s after a commit — so
# firing on those would burn build minutes to redeploy an unchanged worker. `db/**` is
# deliberately EXCLUDED too: schema files are applied by hand to D1 and are not worker inputs.
#
# STILL TRUE, and the reason a redeploy is ever needed: the worker runs the code from its LAST
# DEPLOY, not from main. A merged commit that has not been deployed is not live. This trigger
# closes that gap automatically; the button remains for when you want to force one anyway
# (e.g. re-applying WRITE_KEY after editing it in the dashboard by mistake).
# ============================================================================
#
# ============================================================================
# 🔍 WHY THIS FILE LOOKS LIKE A DIAGNOSTIC HARNESS RATHER THAN A DEPLOY
#
# Three failed runs, and the log tells a story worth keeping:
#
#   RUN 1+2 — "The process '/usr/local/bin/npx' failed with exit code 1". Says nothing.
#     cloudflare/wrangler-action swallows wrangler's real error and reports its own exit
#     code (cloudflare/wrangler-action#360). → THE ACTION IS GONE; wrangler runs directly
#     so the error is ours to capture.
#
#   RUN 2's "fix" — echoed diagnostics to stdout, which the mobile annotation panel does not
#     render, and `continue-on-error` suppressed even the failures. Run 2 looked identical to
#     run 1. → EVERYTHING WRITES TO $GITHUB_STEP_SUMMARY, which renders on a phone.
#     Rule: a diagnostic that reports somewhere the reader cannot see is not a diagnostic.
#
#   RUN 3 — the real cause, at last: a 50-character CLOUDFLARE_ACCOUNT_ID. An account id is
#     EXACTLY 32 hex characters, so the deploy called
#     /accounts/<garbage>/workers/services/... and Cloudflare answered 7003 "perhaps your
#     object identifier is invalid" + 7000 "no route for that URI".
#
#     🔴 AND BOTH PREFLIGHTS PASSED, because neither one CAN catch this:
#        `whoami` does not use the account id — it asks the token which accounts it can see.
#        `deploy --dry-run` never contacts the account at all.
#     Two green checks sat directly above the failing call and were structurally incapable of
#     detecting the fault. Worse: the secrets step PRINTED "50 chars" and carried a comment
#     saying 32 was expected. The evidence was emitted and not acted on.
#     → Rule: AN OBSERVATION IS NOT A CHECK. If a shape is known, assert it.
# ============================================================================

name: Deploy inciardi-collection worker

on:
  push:
    branches: [main]
    paths:
      - 'inciardi-collection/worker/**'
      - 'inciardi-collection/wrangler.toml'
      - '.github/workflows/deploy-inciardi-collection.yml'
  workflow_dispatch:
    inputs:
      database_id:
        description: "Override the D1 database id (leave blank — wrangler.toml already has it)"
        required: false
        type: string

permissions:
  contents: read          # least privilege: this job reads the repo and nothing else

concurrency:
  group: deploy-inciardi-collection
  cancel-in-progress: false   # never race two deploys of the same worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inciardi-collection
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # No version pin. An earlier commit pinned "4.28.1", a number I invented and never
      # verified — and a nonexistent version fails with exit code 1, the same symptom being
      # debugged. `wrangler@4` tracks the major without asserting a release exists.
      WR: "npx --yes wrangler@4"

    steps:
      - uses: actions/checkout@v4

      # On an automatic run nobody is watching the log, so the summary has to say WHY it ran.
      # A deploy that appears in the history with no stated cause is the kind of thing that
      # gets "cleaned up" by a future reader who cannot tell if it was intentional.
      - name: Why this ran
        run: |
          {
            echo "## Deploy · ${{ github.event_name }}"
            echo ""
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Automatic: a push to \`main\` touched the worker, its config, or this workflow."
              echo "Commit: \`${{ github.sha }}\`"
            else
              echo "Manual run from the Actions tab."
            fi
            echo ""
            echo "⚠️ This deploy also (re)applies \`WRITE_KEY\` from wrangler.toml \`[vars]\`, overwriting any dashboard value of the same name."
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 SHAPE ASSERTIONS, not observations. Run 3 died because a malformed account id was
      # printed and waved through. Values are never echoed — only lengths and a regex verdict.
      - name: Preflight · are the credentials the right SHAPE?
        run: |
          echo "## Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          FAIL=0

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or missing."
            echo "- ❌ token **empty or missing**" >> "$GITHUB_STEP_SUMMARY"; FAIL=1
          else
            echo "- ✅ token present (${#CLOUDFLARE_API_TOKEN} chars)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or missing."
            echo "- ❌ account id **empty or missing**" >> "$GITHUB_STEP_SUMMARY"; FAIL=1
          elif ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qiE '^[0-9a-f]{32}$'; then
            # THE CHECK THAT SHOULD HAVE EXISTED ON RUN 1. A wrong-shaped id produces a
            # confusing 7003/7000 routing error from a URL path, minutes later, with no hint
            # that the id is the problem.
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a valid account id (${#CLOUDFLARE_ACCOUNT_ID} chars; must be exactly 32 hex). Find it at dash.cloudflare.com — Workers & Pages, Account Details card. It is NOT your email, your zone id, or the D1 database id."
            {
              echo "- ❌ account id is **${#CLOUDFLARE_ACCOUNT_ID} chars — must be exactly 32 hex characters**"
              echo ""
              echo "  Fix: **dash.cloudflare.com → Workers & Pages → Account Details → Account ID** (copy button)."
              echo "  It is not your email, not a zone id, and not the D1 database id."
              echo "  Re-save it at Settings → Secrets and variables → Actions → \`CLOUDFLARE_ACCOUNT_ID\`."
            } >> "$GITHUB_STEP_SUMMARY"
            FAIL=1
          else
            echo "- ✅ account id present and correctly shaped (32 hex)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # The common version of this mistake is pasting the two values into each other's
          # boxes, which leaves a 32-hex "token" and a long "account id".
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qiE '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN looks like an account id (32 hex). The two values may have been swapped."
            echo "- ⚠️ token looks like an **account id** — check the two secrets are not swapped" >> "$GITHUB_STEP_SUMMARY"
            FAIL=1
          fi

          exit $FAIL

      # Same rule as above, applied to the thing this deploy now carries. The worker returns
      # 503 on every write when WRITE_KEY is unset, and that state is INVISIBLE from /health
      # (reads are unauthenticated) — so it has to be asserted here or it is not checked at
      # all. Never echo the value; the pair is public in the repo, but a CI log is a different
      # surface and habits generalize.
      - name: Preflight · does the config actually carry a write key?
        run: |
          if ! grep -qE '^WRITE_KEY[[:space:]]*=' wrangler.toml; then
            echo "::error::wrangler.toml has no WRITE_KEY under [vars]. Deploying would leave the worker refusing every write with a 503, and /health would still look green."
            echo "- ❌ no \`WRITE_KEY\` in wrangler.toml — writes would 503" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          LEN=$(grep -m1 -E '^WRITE_KEY[[:space:]]*=' wrangler.toml | sed 's/.*"\(.*\)".*/\1/' | tr -d '\n' | wc -c)
          if [ "$LEN" -lt 16 ]; then
            echo "::error::WRITE_KEY is only $LEN chars. It ships in a public bundle, so a short or word-like key is guessable by anyone — the exact defect still open in inciardi-market (\"mikey\"/\"nickey\"). Use a long random string."
            echo "- ❌ \`WRITE_KEY\` is **$LEN chars — too short for a publicly readable key**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ \`WRITE_KEY\` present in config ($LEN chars) — must match \`DEFAULT_KEY\` in core.js" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the D1 database id
        run: |
          FILE=wrangler.toml
          ID="${{ inputs.database_id }}"
          if [ -z "$ID" ]; then ID="${{ vars.INCIARDI_DB_ID }}"; fi

          if grep -q PASTE_DATABASE_ID_HERE "$FILE"; then
            if [ -z "$ID" ]; then
              echo "::error::wrangler.toml holds the placeholder and no id was supplied."
              exit 1
            fi
            sed -i "s|PASTE_DATABASE_ID_HERE|$ID|" "$FILE"
          elif [ -n "$ID" ]; then
            sed -i "s|^database_id = .*|database_id = \"$ID\"|" "$FILE"
            echo "- ℹ️ overrode the committed database id for this run" >> "$GITHUB_STEP_SUMMARY"
          fi

          BOUND=$(grep '^database_id' "$FILE" | sed 's/.*"\(.*\)".*/\1/')
          echo "- ✅ bound to database \`${BOUND:0:8}…\`" >> "$GITHUB_STEP_SUMMARY"
          if grep -q PASTE_DATABASE_ID_HERE "$FILE"; then
            echo "::error::Still the placeholder. A worker bound to nothing looks like it worked."
            exit 1
          fi

      # ⚠️ KEPT, BUT KNOW WHAT IT IS WORTH: `whoami` passes with a garbage account id, because
      # it asks the TOKEN which accounts it can see and never uses CLOUDFLARE_ACCOUNT_ID. It
      # proves the token is real. It proves nothing about the account. Run 3 is the proof.
      - name: Preflight · whoami (proves the TOKEN only)
        run: |
          set +e
          $WR whoami > who.txt 2>&1
          RC=$?
          {
            echo ""
            echo "## \`wrangler whoami\` — exit $RC"
            echo "_Proves the token is valid. Does NOT check the account id — it isn't used here._"
            echo ""
            echo '```'
            cat who.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $RC -ne 0 ]; then
            echo "::error::whoami failed — the token itself is the problem. See the run summary."
          fi
          exit 0

      # ⚠️ Same caveat: a dry-run never contacts the account. It validates wrangler.toml, the
      # entrypoint and the bindings locally. Green here says nothing about credentials.
      - name: Preflight · dry-run build (local only, no account contact)
        run: |
          set +e
          $WR deploy --dry-run > dry.txt 2>&1
          RC=$?
          {
            echo ""
            echo "## \`deploy --dry-run\` — exit $RC"
            echo "_Local build + binding check. Never contacts your account._"
            echo ""
            echo '```'
            tail -40 dry.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $RC -ne 0 ]; then
            echo "::error::The config does not build. Not an auth problem. See the run summary."
          fi
          exit 0

      # THE DEPLOY, run directly. No wrapper, so wrangler's real error is ours to surface:
      # written to the summary AND pushed into an annotation.
      - name: Deploy
        run: |
          set +e
          $WR deploy > out.txt 2>&1
          RC=$?
          {
            echo ""
            echo "## \`wrangler deploy\` — exit $RC"
            echo ""
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat out.txt
          if [ $RC -ne 0 ]; then
            if grep -q '7003\|7000' out.txt; then
              echo "::error::Cloudflare could not route the request — that is almost always a malformed CLOUDFLARE_ACCOUNT_ID (must be exactly 32 hex characters)."
            fi
            MSG=$(grep -m1 -E 'ERROR|error|Error' out.txt | head -c 400)
            echo "::error::wrangler deploy failed: ${MSG:-see the run summary}"
            exit $RC
          fi
          URL=$(grep -m1 -oE 'https://[a-z0-9.-]*workers\.dev' out.txt)
          {
            echo ""
            echo "### ✅ Deployed — and the write key went with it"
            echo ""
            echo "**Worker URL:** \`${URL:-check the log above}\`"
            echo ""
            echo "**Nothing to do in the Cloudflare dashboard.** \`WRITE_KEY\` ships in"
            echo "wrangler.toml and was just applied; the app carries the matching key in"
            echo "\`core.js\`. Open the app and save something — no ⚙ setup, no pasting."
            echo ""
            echo "⚠️ \`/health\` passing does NOT prove writes work: reads are unauthenticated."
            echo "A real save is the only test. A 401 means the two halves of the pair drifted."
          } >> "$GITHUB_STEP_SUMMARY"
