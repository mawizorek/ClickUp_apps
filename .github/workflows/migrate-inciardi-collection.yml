# Apply a D1 migration to inciardi-collection — BY BUTTON, NEVER BY PUSH.
#
# Actions → "Migrate inciardi-collection D1" → Run workflow → pick the file → confirm.
#
# ============================================================================
# 🔴 WHY THIS IS A SEPARATE FILE FROM THE DEPLOY WORKFLOW
#
# The deploy workflow fires on PUSH. A migration that fires on push is the single worst
# thing in this design space: merging a .sql file would apply it, and applying it twice
# would run `DROP TABLE edition_image` against a populated table.
#
# Two opposite trigger rules living in one file is how one eventually gets applied to the
# other by a well-meaning edit. So: `workflow_dispatch` ONLY, in its own file, with no
# `push:` block to accidentally extend.
#
# The deploy workflow's own comment already named this seam — it excludes `db/**` from its
# path filter because "schema files are applied by hand and are not worker inputs." This is
# that exclusion growing a door, rather than the exclusion being weakened.
# ============================================================================
#
# ============================================================================
# 🔴 WHY THIS USES ITS OWN TOKEN — CLOUDFLARE_D1_TOKEN, NOT CLOUDFLARE_API_TOKEN
#
# Run 3 reached the apply step and failed:
#     A request to the Cloudflare API (/accounts/***/d1/database/045f1943…/import) failed.
#     Authentication error [code: 10000]
# The "Edit Cloudflare Workers" template does NOT carry D1 write. Now CONFIRMED, after three
# PRs carried it as an unverified caveat.
#
# 🔴 THE OBVIOUS FIX WAS THE WRONG ONE. "Just re-scope CLOUDFLARE_API_TOKEN to include
# D1:Edit" works today, and breaks the DEPLOY workflow the moment that replacement token
# turns out to be D1-only — later, in a different workflow, with no visible connection to the
# swap. A shared credential means every permission change is a change to every consumer.
#
# So this workflow carries its own secret and the deploy path is untouched. Least privilege
# in both directions: the deploy token cannot write the database, the migration token cannot
# ship code.
#
# 🚫 NO FALLBACK to CLOUDFLARE_API_TOKEN, deliberately. A fallback would make a run "work"
# using a different credential than the one named — the silent-fallback failure this repo
# already has a law about (`hooks/silent-fallback-law.md`). It fails loudly with the creation
# steps instead.
#
# ⚠️ THE MISREADING THIS FAILURE INVITES. Wrangler printed, directly under the auth error:
#       🎢 Membership roles: Super Administrator - All Privileges
# That is the ACCOUNT MEMBERSHIP OF THE HUMAN the token belongs to. It is NOT the token's
# scopes. A scoped token is limited no matter how privileged its owner is. Read together the
# two lines look like a contradiction and send you hunting for a Cloudflare bug.
#
# TO CREATE IT (phone-doable):
#   dash.cloudflare.com/profile/api-tokens → Create Token → Create Custom Token
#   Permissions:  Account · D1 · Edit
#   Account Resources: Include · your account
#   Create, copy it once, then:
#   repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: CLOUDFLARE_D1_TOKEN
# ============================================================================
#
# ============================================================================
# 🔴 WHY THE DOUBLE-RUN GUARD IS STRUCTURAL
#
# This app's design law (decision log J6) ranks the ways to prevent a contradiction:
#   1 derive it · 2 make it structurally impossible · 3 trigger · 4 one write path ·
#   5 detect and announce.
# A warning in the description is rung 5. So the workflow READS `applied.log` and refuses a
# file already listed — the second press cannot happen, rather than being asked not to.
#
# The log is written BY THIS WORKFLOW after a successful run. A hand-maintained ledger
# drifts; this one cannot claim a migration ran unless it did.
# ============================================================================
#
# ============================================================================
# 🔴 WHY `file` IS A DROPDOWN, AND WHY IT NEEDS AN EXPLICIT DEFAULT
#
# RUN 1 failed at the existence preflight, reporting
#     No such file: inciardi-collection/db/migrations/001-photos-and-groupings.sql
# while that exact path sat on main at 9,761 bytes. The file was fine. The INPUT was not —
# a path that must be character-perfect, hand-typed on a phone keyboard with autocorrect,
# smart punctuation and an eager space bar.
#
# The set of legal values is KNOWN AND TINY: it is the contents of one directory. A free-text
# field for a closed set is rung 5 (validate, then complain). A dropdown is rung 2 — the
# mistake becomes unrepresentable. Same law the schema itself is built on.
#
# RUN 2 never started: the mobile app showed the file value and left "Run Workflow" greyed
# out, and re-picking the displayed value did not release it. 🔴 A required `choice` input
# with NO `default:` DISPLAYS its first option but REGISTERS no selection — the value you can
# see is not a value the form has, so it never becomes valid. Hence the explicit `default:`
# below.
#
# ⚠️ HONEST COST OF THE DROPDOWN: adding migration 002 requires adding one line to `options`,
# one `case` arm below, and a decision about `default`. Deliberately NOT softened with a
# free-text override — an escape hatch that reintroduces the exact failure being fixed is not
# a fix. And a second place where a new migration must be acknowledged is not the worst
# property for DDL to have.
#
# 🚫 000 IS NOT IN THE LIST, ON PURPOSE. It was applied by hand before this workflow existed
# and cannot be re-run (SQLite has no ADD COLUMN IF NOT EXISTS). It is in `applied.log`, so
# the guard would refuse it anyway — but an unrunnable option in a dropdown is a trap, and
# two independent refusals are better than one.
#
# ⚠️ `confirm` KEEPS ITS "no" DEFAULT. It is the only thing between a mis-tap and a DROP TABLE
# on the live database. Defaulting it to "apply" would save exactly one tap and cost the whole
# gate. `file` is safe to default precisely BECAUSE confirm is not — naming a file changes
# nothing on its own.
# ============================================================================
#
# ============================================================================
# 🔴 WHERE DIAGNOSTICS GO — CORRECTING THE DEPLOY WORKFLOW'S RULE
#
# That file records: "everything writes to $GITHUB_STEP_SUMMARY, which renders on a phone,"
# learned after stdout proved invisible in the mobile annotation panel. True, and INCOMPLETE.
#
# Run 1 here printed `ls db/migrations/*.sql` — the listing that answers the failure
# instantly — into the summary. Michael never saw it: "not sure where to look for summary."
# The summary renders on a phone BROWSER, but the GitHub mobile APP drops you straight into
# raw step logs on a failure, with the summary several taps back behind the run title.
#
# SO THE RULE IS NOT "USE THE SUMMARY." IT IS:
#     THE FAILURE REASON GOES IN THE ANNOTATION.
#     The summary is for the detail you go looking for once you know what broke.
#
# ⚠️ AND THE GENERAL FORM, now that this has bitten three times in two days (stdout in the
# deploy workflow, the summary in #650, the FORM in #652): this is operated from a phone and
# from nothing else. "It renders fine on a desktop" is not a passing grade. Labels are short,
# and every options list leads with the part that must survive truncation.
# ============================================================================

name: Migrate inciardi-collection D1

on:
  workflow_dispatch:
    inputs:
      # ⚠️ The `default` is load-bearing on mobile — without it the form shows a value it has
      # not actually selected and the Run button stays disabled. See run 2 above.
      # The label leads with the NUMBER because the mobile sheet truncates the middle of the
      # value (`db/mig...ings.sql`), and a label whose unique part gets cut off is not a label.
      file:
        description: "Migration"
        required: true
        type: choice
        default: "001 · photos + groupings"
        options:
          - "001 · photos + groupings"
      confirm:
        description: "Writes to the LIVE database"
        required: true
        default: "no"
        type: choice
        options: ["no", "apply"]

permissions:
  contents: write        # needed ONLY to append applied.log after a successful run

concurrency:
  group: migrate-inciardi-collection
  cancel-in-progress: false   # never race two migrations against one database

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inciardi-collection
    env:
      # 🔴 NOT CLOUDFLARE_API_TOKEN. See the token block at the top of this file.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: inciardi-collection
      # No version pin. The deploy workflow learned this the expensive way: a pinned
      # version that does not exist fails with exit code 1, the same symptom as everything
      # else. `wrangler@4` tracks the major without asserting a release exists.
      WR: "npx --yes wrangler@4"
      LABEL: ${{ inputs.file }}

    steps:
      - uses: actions/checkout@v4

      # The dropdown carries a HUMAN label; the job needs a PATH. Resolved here, in one
      # place, with an explicit failure rather than a silent empty string — an unmapped label
      # would otherwise reach `[ ! -f "" ]` and report "no such file: " with nothing after it.
      - name: Resolve the label to a path
        run: |
          case "$LABEL" in
            "001 · photos + groupings") MIG="db/migrations/001-photos-and-groupings.sql" ;;
            *)
              echo "::error::Unmapped migration label: '$LABEL'. Someone added an option to the dropdown without adding its case here. Both live in .github/workflows/migrate-inciardi-collection.yml."
              exit 1 ;;
          esac
          echo "MIG=$MIG" >> "$GITHUB_ENV"

      - name: Header
        run: |
          {
            echo "## D1 migration · \`$DB_NAME\`"
            echo ""
            echo "**File:** \`$MIG\`"
            echo "**Confirm:** \`${{ inputs.confirm }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate · did you mean it?
        run: |
          if [ "${{ inputs.confirm }}" != "apply" ]; then
            echo "::error::Confirm was left on 'no' — nothing ran. Set the second dropdown to 'apply'. This is the intended outcome of a mis-tap."
            echo "- 🛑 **not confirmed — nothing ran**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ confirmed" >> "$GITHUB_STEP_SUMMARY"

      # SHAPE ASSERTIONS, not observations. The deploy workflow burned three runs on a
      # 50-character account id that was PRINTED and waved through: an observation is not a
      # check. If a shape is known, assert it.
      #
      # The D1 token check fires HERE rather than at the API call, so a missing secret costs
      # two seconds instead of forty seconds of npx install and file upload.
      - name: Preflight · credential shape
        run: |
          FAIL=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_D1_TOKEN is not set. This workflow deliberately does NOT fall back to CLOUDFLARE_API_TOKEN (that token is Workers-scoped and cannot write D1 — proven by run 3). Create one: dash.cloudflare.com/profile/api-tokens → Create Token → Create Custom Token → Permissions: Account · D1 · Edit → Account Resources: your account. Then repo Settings → Secrets and variables → Actions → New repository secret named CLOUDFLARE_D1_TOKEN."
            {
              echo "- ❌ **\`CLOUDFLARE_D1_TOKEN\` is not set**"
              echo ""
              echo "  1. dash.cloudflare.com/profile/api-tokens → **Create Token** → **Create Custom Token**"
              echo "  2. Permissions: **Account · D1 · Edit**"
              echo "  3. Account Resources: **Include · your account**"
              echo "  4. Create, copy it (shown once)"
              echo "  5. Repo → Settings → Secrets and variables → Actions → **New repository secret**, named \`CLOUDFLARE_D1_TOKEN\`"
              echo ""
              echo "  ⚠️ Do **not** reuse or re-scope \`CLOUDFLARE_API_TOKEN\` — the deploy workflow depends on it as-is."
            } >> "$GITHUB_STEP_SUMMARY"
            FAIL=1
          else
            echo "- ✅ D1 token present (${#CLOUDFLARE_API_TOKEN} chars)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qiE '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hex characters (got ${#CLOUDFLARE_ACCOUNT_ID}). dash.cloudflare.com → Workers & Pages → Account Details."
            echo "- ❌ account id is **${#CLOUDFLARE_ACCOUNT_ID} chars — must be exactly 32 hex**" >> "$GITHUB_STEP_SUMMARY"; FAIL=1
          else
            echo "- ✅ account id correctly shaped (32 hex)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $FAIL

      - name: Preflight · does the migration exist?
        run: |
          if [ ! -f "$MIG" ]; then
            # 🔴 THE EVIDENCE GOES IN THE ANNOTATION, not only the summary. Run 1 put the
            # available-files listing somewhere the person holding the phone could not reach.
            AVAIL=$(ls -1 db/migrations/*.sql 2>/dev/null | tr '\n' ' ')
            echo "::error::No such file: inciardi-collection/$MIG — available migrations are: ${AVAIL:-(none)}"
            {
              echo "- ❌ **no such file:** \`inciardi-collection/$MIG\`"
              echo ""
              echo "  Available:"
              echo '```'
              ls -1 db/migrations/*.sql 2>/dev/null || echo "(none)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          SHA=$(sha256sum "$MIG" | cut -d' ' -f1)
          echo "MIG_SHA=$SHA" >> "$GITHUB_ENV"
          echo "- ✅ file found ($(wc -c < "$MIG") bytes, sha256 \`${SHA:0:12}…\`)" >> "$GITHUB_STEP_SUMMARY"

      # 🔴 THE GUARD. Rung 2, not rung 5.
      - name: Guard · has this already been applied?
        run: |
          LOG=db/migrations/applied.log
          REL="inciardi-collection/$MIG"
          if [ -f "$LOG" ] && grep -qF " $REL" "$LOG"; then
            WHEN=$(grep -F " $REL" "$LOG" | head -1 | cut -d' ' -f1)
            echo "::error::REFUSED — $REL was already applied at $WHEN. Migrations are not idempotent: 001 contains DROP TABLE, which is free against an empty table and destroys the photo library against a populated one. To change something, write a NEW numbered migration."
            {
              echo "- 🛑 **REFUSED — already applied**"
              echo ""
              echo '```'
              grep -F " $REL" "$LOG"
              echo '```'
              echo ""
              echo "  Migrations are not idempotent. Write a NEW numbered file rather than replaying this one."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ not previously applied" >> "$GITHUB_STEP_SUMMARY"

      # The record of WHAT RAN has to live next to the record that it ran. Printed before
      # execution so it survives even if the execute step dies halfway.
      - name: Show the SQL
        run: |
          {
            echo ""
            echo "<details><summary>SQL being applied</summary>"
            echo ""
            echo '```sql'
            cat "$MIG"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: |
          set +e
          # -y skips the interactive confirmation. If wrangler ever rejects it as an unknown
          # flag, that is the first thing to drop — it is convenience, not correctness.
          $WR d1 execute "$DB_NAME" --remote -y --file="$MIG" > out.txt 2>&1
          RC=$?
          {
            echo ""
            echo "## \`d1 execute\` — exit $RC"
            echo ""
            echo '```'
            tail -60 out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat out.txt
          if [ $RC -ne 0 ]; then
            # Name the failures that look like something else, so none gets misread. Each
            # carries a line of the real output INTO the annotation — see the diagnostics
            # rule at the top of this file.
            WHY=$(grep -m1 -iE 'error|✘' out.txt | head -c 300)
            if grep -qiE 'authent|authoriz|10000|permission' out.txt; then
              echo "::error::Authorization failure on CLOUDFLARE_D1_TOKEN — it exists but lacks D1 write on this account. Re-create it with Permissions: Account · D1 · Edit, and Account Resources set to your account. ⚠️ IGNORE wrangler's 'Super Administrator - All Privileges' line: that is your ACCOUNT MEMBERSHIP, not the token's scopes. A scoped token is limited no matter how privileged its owner is."
            elif grep -qiE 'no such column|no such table|error in view' out.txt; then
              echo "::error::The MIGRATION is wrong, not the credentials — a view or index still references something this migration drops. Read db/views.sql before retrying. Wrangler said: ${WHY}"
            else
              echo "::error::Migration failed: ${WHY:-see the run summary}"
            fi
            echo "::error::Nothing was applied — a D1 batch is atomic — and applied.log is untouched. Fix and press the button again."
            echo "- ❌ **failed — nothing applied, nothing logged**" >> "$GITHUB_STEP_SUMMARY"
            exit $RC
          fi
          echo "- ✅ applied" >> "$GITHUB_STEP_SUMMARY"

      # A migration that reports success without showing the resulting shape is asking to be
      # believed. This makes the outcome READABLE on a phone, which is the whole point of the
      # button existing.
      - name: Verify · what the database actually looks like now
        run: |
          set +e
          $WR d1 execute "$DB_NAME" --remote -y \
            --command="SELECT type, name FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name" > shape.txt 2>&1
          {
            echo ""
            echo "<details><summary>Schema after this migration</summary>"
            echo ""
            echo '```'
            tail -120 shape.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Only reached on success — every step above uses default failure semantics, so a
      # failed migration can never be logged as applied.
      - name: Record it
        run: |
          cd "$GITHUB_WORKSPACE"
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "$STAMP $MIG_SHA inciardi-collection/$MIG" >> inciardi-collection/db/migrations/applied.log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inciardi-collection/db/migrations/applied.log
          git commit -m "d1(inciardi-collection): applied $MIG"
          # Rebase rather than force: another session may have pushed while this ran, and a
          # migration log is the last file that should ever clobber someone else's commit.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          {
            echo ""
            echo "### ✅ Applied and recorded"
            echo ""
            echo "\`$STAMP\` · \`${MIG_SHA:0:12}…\` · \`$MIG\`"
            echo ""
            echo "**This file can no longer be run.** The guard will refuse it from now on."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Applied $MIG and recorded it in applied.log. This file can no longer be run."
