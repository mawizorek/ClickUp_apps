# ═══════════════════════════════════════════════════════════════════════════════
# MOVE A FOLDER — standing cross-repo utility. Manual dispatch only.
#
# ⭐ THERE IS ONE OPERATION HERE AND IT IS A MERGE. Michael, 2026-08-06: "move is
# just merge without anything in the starting point." He is right, and this file
# was built the other way round until then -- move was the operation and merge was
# a refusal, which is why the collision handling landed at the wrong granularity.
#
#   rename ... merge into a sibling path that does not exist yet. 0 collisions.
#   move ..... merge into another parent that does not exist yet. 0 collisions.
#   merge .... the same walk, into somewhere that already has files in it.
#
# So the engine is: walk the tracked files under the source, compute each one's
# target, move them individually. Everything else is which inputs you filled in.
#
#   new_name only ........ guides/pm/old -> guides/pm/new
#   dest_parent only ..... guides/pm/old -> archive/old
#   both ................. guides/pm/old -> archive/new
#   destination exists ... a merge, and on_collision decides what happens
#
# 🚫 NO WHOLE-FOLDER `git mv` FAST PATH, DELIBERATELY. It would be a second code
# path for the zero-collision case, and a second code path is precisely where the
# two operations drift apart again -- that drift is what this commit is undoing.
# It also was not buying what its commit messages claimed: GIT STORES NO RENAME
# RECORDS. A rename is INFERRED from content similarity at diff time, so moving
# 54 files one at a time preserves exactly as much history as moving the
# directory in one call. The shortcut was faster to type and nothing else.
#
# WHY A RUNNER AND NOT API CALLS: the GitHub contents API cannot move a file. It
# writes a new path and deletes the old one, which means reading and re-pushing
# every byte, one commit each, and a half-migrated tree if anything fails midway.
# Born 2026-08-05 from the one-shot 02-courses runner.
#
# ───────────────────────────────────────────────────────────────────────────────
# 🔴 TWO LIMITS. BOTH REAL. NEITHER IS A BUG.
#
# 1 · A DROPDOWN CANNOT BE POPULATED FROM AN API. `workflow_dispatch` choice inputs
#     are a STATIC list baked into this file, so the REPO list is hand-maintained
#     and the FOLDER cannot be a dropdown at all. `browse` mode is the answer to
#     that, not a workaround for it.
#
# 2 · CROSS-REPO WRITES NEED A PAT in the REPO_OPS_TOKEN secret, on THIS repo.
#     The automatic GITHUB_TOKEN is scoped to its own repo and cannot push to
#     uritp-docs. Step one fails with instructions rather than half-running.
#
# ⚠️ AND THE ONE THIS TOOL CANNOT FIX: a collision handled by suffix leaves TWO
#    files claiming one `id:` in their frontmatter. The renderer reports
#    duplicate_id, the build SUCCEEDS, and last writer wins silently for every
#    inbound link. Renaming a file does not rename what is inside it.
# ═══════════════════════════════════════════════════════════════════════════════

name: Move a folder

run-name: "${{ inputs.mode }} · ${{ inputs.repo }} · ${{ inputs.path }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo"
        required: true
        type: choice
        options:
          - uritp-docs
          - ClickUp_apps
          - doc-render-engine
          - maw-themes
          - maw-prose
          - template-docs
      mode:
        description: "browse = look around, no writes · plan = dry run · apply = do it"
        required: true
        default: browse
        type: choice
        options:
          - browse
          - plan
          - apply
      path:
        description: "The folder to move. Full path from the repo root."
        required: false
        default: ""
      new_name:
        description: "New leaf name, no slashes. Blank = keep the current name."
        required: false
        default: ""
      dest_parent:
        description: "The folder to move it INTO. Must already exist. Blank = stay put."
        required: false
        default: ""
      on_collision:
        description: "Per FILE, if the destination already has one: refuse · suffix (original stays, incoming lands as NAME_moved.EXT) · skip (leave it behind)"
        required: false
        default: refuse
        type: choice
        options:
          - refuse
          - suffix
          - skip

permissions:
  contents: read

jobs:
  folder:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token exists
        env:
          TOKEN: ${{ secrets.REPO_OPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::Secret REPO_OPS_TOKEN is not set. This runner writes to OTHER repos, and the automatic GITHUB_TOKEN cannot. Add a fine-grained PAT with Contents read+write on the target repos as REPO_OPS_TOKEN in this repo's secrets, then dispatch again. Nothing was changed."
            exit 1
          fi
          echo "Token present."

      - name: Check out the target repo
        uses: actions/checkout@v4
        with:
          repository: mawizorek/${{ inputs.repo }}
          token: ${{ secrets.REPO_OPS_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Browse
        if: inputs.mode == 'browse'
        working-directory: target
        run: |
          set -euo pipefail
          BASE="${{ inputs.path }}"; BASE="${BASE%/}"
          if [ -z "$BASE" ]; then BASE="."; fi

          if [ ! -d "$BASE" ]; then
            echo "::error::'$BASE' is not a folder in ${{ inputs.repo }}. Browse the level above it first."
            exit 1
          fi

          {
            echo "## Browsing \`${{ inputs.repo }}\` at \`$BASE\`"
            echo ""
            echo "| Folder | Files (tracked, recursive) | Subfolders |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FOUND=0
          while IFS= read -r d; do
            FOUND=1
            CLEAN="${d#./}"
            NFILES=$(git ls-files "$d" | wc -l | tr -d ' ')
            NSUBS=$(find "$d" -mindepth 1 -maxdepth 1 -type d -not -name '.git' | wc -l | tr -d ' ')
            FLAG=""
            if [ "$NFILES" = "0" ]; then FLAG=" ⚠️ untracked"; fi
            echo "| \`$CLEAN\`$FLAG | $NFILES | $NSUBS |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find "$BASE" -mindepth 1 -maxdepth 1 -type d -not -name '.git' | sort)

          if [ "$FOUND" -eq 0 ]; then
            echo "| _no subfolders — this is a leaf_ | | |" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "### Next"
            echo ""
            echo "- **Deeper:** dispatch again with \`path\` set to one of the folders above."
            echo "- **Rename:** \`mode: plan\`, that folder as \`path\`, new leaf in \`new_name\`."
            echo "- **Move or merge:** \`mode: plan\`, that folder as \`path\`, target parent in \`dest_parent\`."
            echo ""
            echo "⚠️ **untracked** means git has no committed files under it. Git does not store"
            echo "empty directories, so there is nothing there to move."
            echo ""
            echo "Read-only. Nothing was changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan or apply
        if: inputs.mode == 'plan' || inputs.mode == 'apply'
        working-directory: target
        run: |
          set -euo pipefail
          SRC="${{ inputs.path }}";        SRC="${SRC%/}";               SRC="${SRC#./}"
          NEW="${{ inputs.new_name }}"
          PARENT_IN="${{ inputs.dest_parent }}"; PARENT_IN="${PARENT_IN%/}"; PARENT_IN="${PARENT_IN#./}"
          COLLIDE="${{ inputs.on_collision }}"
          MODE="${{ inputs.mode }}"

          # ── Guards. All of these pass before anything moves. ──

          if [ -z "$SRC" ] || [ "$SRC" = "." ]; then
            echo "::error::path is empty. You cannot move the repo root."; exit 1
          fi
          if [ -z "$NEW" ] && [ -z "$PARENT_IN" ]; then
            echo "::error::Both new_name and dest_parent are empty, so this is a no-op."; exit 1
          fi
          case "$SRC$PARENT_IN" in *..*) echo "::error::A path contains '..'. Refusing."; exit 1 ;; esac
          case "$SRC" in .git|.git/*|.github|.github/*) echo "::error::'$SRC' is repo plumbing. Refusing."; exit 1 ;; esac
          case "$NEW" in
            */*) echo "::error::new_name '$NEW' is the LEAF only. To put the folder somewhere else use dest_parent."; exit 1 ;;
            .*)  echo "::error::new_name '$NEW' starts with a dot. Refusing to create a hidden folder."; exit 1 ;;
          esac
          if [ ! -e "$SRC" ]; then
            echo "::error::'$SRC' does not exist in ${{ inputs.repo }}. Run browse mode to find it."; exit 1
          fi
          if [ -f "$SRC" ]; then
            echo "::error::'$SRC' is a FILE. This runner moves folders only, by design."; exit 1
          fi

          NFILES=$(git ls-files "$SRC" | wc -l | tr -d ' ')
          if [ "$NFILES" = "0" ]; then
            echo "::error::'$SRC' contains no tracked files. Git does not store empty directories -- a folder exists only as the paths of the files inside it -- so there is nothing here to move. If you expected files, they are untracked or ignored."
            exit 1
          fi

          # ── Where it lands. ──

          if [ -n "$PARENT_IN" ]; then
            DEST_PARENT="$PARENT_IN"
            if [ ! -d "$DEST_PARENT" ]; then
              echo "::error::dest_parent '$DEST_PARENT' does not exist. This runner will not build a folder tree on the way past."; exit 1
            fi
            case "$DEST_PARENT/" in "$SRC"/*) echo "::error::dest_parent is inside the source. A folder cannot be moved into itself."; exit 1 ;; esac
          else
            DEST_PARENT=$(dirname "$SRC")
          fi

          LEAF="$NEW"; [ -n "$LEAF" ] || LEAF=$(basename "$SRC")
          if [ "$DEST_PARENT" = "." ]; then DEST="$LEAF"; else DEST="$DEST_PARENT/$LEAF"; fi

          if [ "$SRC" = "$DEST" ]; then
            echo "::error::'$SRC' is already exactly that. Nothing to do."; exit 1
          fi

          # ── Case-only rename. The ONE case that cannot go through the file walk. ──
          # `courses` -> `Courses` is two paths on this Linux runner and ONE path on any
          # macOS or Windows checkout. Moving file-by-file would move each file onto
          # itself. Git handles it through a temp name and nothing else does.
          if [ "$(echo "$SRC" | tr 'A-Z' 'a-z')" = "$(echo "$DEST" | tr 'A-Z' 'a-z')" ]; then
            {
              echo "## ${MODE} · case-only rename · \`${{ inputs.repo }}\`"
              echo ""
              echo "\`$SRC\` → \`$DEST\` · **$NFILES** files"
              echo ""
              echo "⚠️ Same path on a case-insensitive filesystem, so this goes through a temp"
              echo "name in two commits. A direct move works here and breaks any macOS clone."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$MODE" = "plan" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Dry run. Nothing was changed.**" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git mv "$SRC" "${DEST}.case-tmp"
            git commit -q -m "Case rename 1/2: $SRC -> ${DEST}.case-tmp"
            git mv "${DEST}.case-tmp" "$DEST"
            git commit -q -m "Case rename 2/2: -> $DEST" -m "Two steps: a direct case-only move is invisible to a case-insensitive filesystem."
            git push
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Applied.** \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ── THE ENGINE. One walk. A move is this with an empty destination. ──

          MOVES=$(mktemp); COLLISIONS=$(mktemp); SKIPS=$(mktemp)
          NCOL=0

          while IFS= read -r f; do
            REL="${f#$SRC/}"
            TARGET="$DEST/$REL"

            if [ -e "$TARGET" ]; then
              NCOL=$((NCOL + 1))
              case "$COLLIDE" in
                skip)
                  printf '%s\n' "$f" >> "$SKIPS"
                  continue ;;
                suffix)
                  BASE=$(basename "$TARGET"); DIR=$(dirname "$TARGET")
                  case "$BASE" in
                    ?*.*) STEM="${BASE%.*}"; EXT=".${BASE##*.}" ;;
                    *)    STEM="$BASE";      EXT="" ;;
                  esac
                  [ -n "$STEM" ] || { STEM="$BASE"; EXT=""; }
                  SUFFIXED="$DIR/${STEM}_moved${EXT}"
                  if [ -e "$SUFFIXED" ]; then
                    echo "::error::'$TARGET' exists AND so does '$SUFFIXED'. Two collisions deep on one file is somebody losing track -- resolve it by hand. Nothing was changed."
                    exit 1
                  fi
                  printf '%s\t%s\n' "$f" "$SUFFIXED" >> "$MOVES"
                  printf '%s\t%s\n' "$TARGET" "$SUFFIXED" >> "$COLLISIONS"
                  continue ;;
                *)
                  echo "::error::'$TARGET' already exists. Refusing to overwrite. Dispatch with on_collision: suffix to land the incoming file as NAME_moved.EXT beside the original, or skip to leave it behind. Nothing was changed."
                  exit 1 ;;
              esac
            fi

            printf '%s\t%s\n' "$f" "$TARGET" >> "$MOVES"
          done < <(git ls-files "$SRC")

          NMOVE=$(wc -l < "$MOVES" | tr -d ' ')
          NSKIP=0; [ -s "$SKIPS" ] && NSKIP=$(wc -l < "$SKIPS" | tr -d ' ')

          OP="rename"
          if [ -d "$DEST" ]; then OP="MERGE"
          elif [ -n "$PARENT_IN" ] && [ -n "$NEW" ]; then OP="move + rename"
          elif [ -n "$PARENT_IN" ]; then OP="move"; fi

          # ── Blast radius: what hardcodes the old path. ──
          HITS=$(grep -rIl --exclude-dir=.git -- "$SRC" . 2>/dev/null | grep -v "^./$SRC/" | sort || true)
          NHITS=$(printf '%s' "$HITS" | grep -c . || true)

          {
            echo "## ${MODE} · ${OP} · \`${{ inputs.repo }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| From | \`$SRC\` |"
            echo "| To | \`$DEST\`$( [ -d "$DEST" ] && echo ' — **already exists, this is a merge**' ) |"
            echo "| Tracked files | **$NFILES** |"
            echo "| Moving | $NMOVE |"
            echo "| Colliding | $NCOL |"
            echo "| Left behind | $NSKIP |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s "$COLLISIONS" ]; then
            {
              echo "### 🔴 Collisions — original stays, incoming file suffixed"
              echo ""
              echo "| Already there | Incoming lands as |"
              echo "|---|---|"
              while IFS=$'\t' read -r a b; do echo "| \`$a\` | \`$b\` |"; done < "$COLLISIONS"
              echo ""
              echo "⚠️ **A suffix fixes the FILENAME and not the \`id:\` inside it.** Two pages"
              echo "declaring one id make the renderer report \`duplicate_id\`, the build still"
              echo "SUCCEEDS, and last writer wins silently for every inbound link. Fix the id."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s "$SKIPS" ]; then
            {
              echo "### ⏭️ Left behind"
              echo ""
              while IFS= read -r f; do echo "- \`$f\`"; done < "$SKIPS"
              echo ""
              echo "⚠️ These stay put, so \`$SRC\` survives the move holding only them."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### What points at \`$SRC\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$NHITS" = "0" ]; then
            echo "Nothing in this repo mentions that path. ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "🔴 **$NHITS file(s) mention it as a literal string** and this move will not update them:"
              echo ""
              printf '%s\n' "$HITS" | sed 's|^\./|- `|; s|$|`|'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "⚠️ Internal \`@\`-refs resolve on \`id\` and are safe. The **published URL** of"
            echo "every page underneath changes, and no later edit undoes that cleanly."
            echo "🔎 This grep covers **this repo only**."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" = "plan" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Dry run. Nothing was changed.** Dispatch again with \`mode: apply\` and the same inputs." >> "$GITHUB_STEP_SUMMARY"
            echo "Plan only. $NMOVE would move, $NCOL collide, $NSKIP left behind, $NHITS literal references."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while IFS=$'\t' read -r from to; do
            mkdir -p "$(dirname "$to")"
            git mv "$from" "$to"
          done < "$MOVES"

          # Tracked files are gone; the empty shells git never stored can go too.
          if [ "$(git ls-files "$SRC" | wc -l | tr -d ' ')" = "0" ] && [ -d "$SRC" ]; then
            find "$SRC" -type d -empty -delete 2>/dev/null || true
          fi

          git commit -q -m "$OP: $SRC -> $DEST" \
                        -m "$NMOVE files moved, $NCOL collisions ($COLLIDE), $NSKIP left behind." \
                        -m "Dispatched via the Move a folder runner in ClickUp_apps."
          git push

          # Verify every intended destination actually exists in the index.
          MISSING=0
          while IFS=$'\t' read -r from to; do
            git ls-files --error-unmatch "$to" >/dev/null 2>&1 || { echo "::error::missing after move: $to"; MISSING=$((MISSING + 1)); }
          done < "$MOVES"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MISSING" != "0" ]; then
            echo "🔴 **$MISSING file(s) are not at their destination.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ **Applied and verified.** $NMOVE file(s) confirmed at \`$DEST\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Applied. $NMOVE verified."
