<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="robots" content="noindex, nofollow">
<title>Routines</title>
<meta name="description" content="Live view of the repo refresh routines. Invoke-only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:oklch(11% 0.012 265); --surface-1:oklch(15% 0.011 265); --surface-2:oklch(19% 0.01 265);
  --text:oklch(95% 0.006 265); --text-mid:oklch(80% 0.008 265); --text-muted:oklch(64% 0.01 265); --text-faint:oklch(38% 0.008 265);
  --accent:oklch(72% 0.15 285); --accent-ink:oklch(17% 0.03 285); --accent-soft:oklch(24% 0.06 285);
  --green:oklch(74% 0.16 155); --green-soft:oklch(26% 0.05 155);
  --amber:oklch(80% 0.13 85); --amber-soft:oklch(26% 0.06 85);
  --red:oklch(66% 0.18 25); --red-soft:oklch(26% 0.06 25);
  --cyan:oklch(80% 0.11 205); --cyan-soft:oklch(26% 0.05 205);
  --hair:oklch(26% 0.006 265); --hair-soft:oklch(21% 0.006 265); --border-hover:oklch(36% 0.008 265);
  --r:13px; --r-sm:9px;
  --e:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-weight:400; -webkit-font-smoothing:antialiased;
  letter-spacing:0.01em; min-height:100svh; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.wrap{width:100%; max-width:600px; margin:0 auto; padding:0 16px; flex:1 0 auto}
::selection{background:var(--accent); color:var(--accent-ink)}

header{padding:32px 0 6px}
.masthead{display:flex; align-items:center; gap:12px}
.title-wrap{flex:1; min-width:0}
.masthead h1{font-size:clamp(1.5rem,5.5vw,1.9rem); font-weight:800; letter-spacing:-0.035em; line-height:1; display:flex; align-items:center; gap:9px}
.masthead h1 .glyph{font-size:0.85em; filter:saturate(1.1)}
.sub{font-size:0.75rem; color:var(--text-muted); margin-top:7px; line-height:1.4}
.sub code,.state code{font-family:'SF Mono','Fira Code',ui-monospace,monospace; font-size:0.9em; color:var(--text-mid)}
.mast-actions{display:flex; gap:8px; flex-shrink:0}
.icon-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--hair); color:var(--text-mid); cursor:pointer; text-decoration:none; transition:border-color 150ms var(--e), color 150ms var(--e), transform 90ms var(--e)}
.icon-btn:hover{border-color:var(--border-hover); color:var(--text)}
.icon-btn:active{transform:scale(0.92)}
.icon-btn svg{width:17px; height:17px}
.icon-btn.spinning svg{animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.window-card{margin-top:18px; background:linear-gradient(160deg, var(--accent-soft), var(--surface-1) 70%); border:1px solid oklch(40% 0.08 285); border-radius:var(--r); padding:15px 16px; position:relative; overflow:hidden}
.window-card::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--accent)}
.wc-label{font-size:0.5625rem; font-weight:700; text-transform:uppercase; letter-spacing:0.11em; color:var(--accent); display:flex; align-items:center; gap:6px}
.wc-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px oklch(72% 0.15 285 / .6)}
.wc-line{font-size:0.9375rem; font-weight:600; color:var(--text); margin-top:7px; line-height:1.4}
.wc-line b{color:var(--accent); font-weight:750}
.wc-note{font-size:0.6875rem; color:var(--text-muted); margin-top:9px; line-height:1.45}
.wc-tally{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.tally{font-size:0.625rem; font-weight:700; padding:4px 9px; border-radius:100px; background:var(--surface-2); color:var(--text-mid); letter-spacing:0.02em}
.tally.bad{background:var(--red-soft); color:var(--red)}
.tally.odd{background:var(--cyan-soft); color:var(--cyan)}
.tally.good{background:var(--green-soft); color:var(--green)}

.sec-label{font-size:0.625rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-faint); margin:26px 0 10px}

.routine{background:var(--surface-1); border:1px solid var(--hair-soft); border-radius:var(--r); padding:15px 16px; margin-bottom:11px; transition:border-color 150ms var(--e)}
.routine:hover{border-color:var(--hair)}
.routine.inactive{opacity:0.62}
.r-top{display:flex; align-items:center; gap:11px}
.r-status{width:9px; height:9px; border-radius:50%; flex-shrink:0}
.r-status.due-soon{background:var(--amber); box-shadow:0 0 6px oklch(80% 0.13 85 / .5)}
.r-status.recent{background:var(--green); box-shadow:0 0 6px oklch(74% 0.16 155 / .5)}
.r-status.idle{background:var(--text-faint)}
.r-status.off{background:var(--red); box-shadow:0 0 6px oklch(66% 0.18 25 / .4)}
.r-status.overdue{background:var(--red); box-shadow:0 0 7px oklch(66% 0.18 25 / .65)}
.r-status.unknown{background:var(--cyan); box-shadow:0 0 6px oklch(80% 0.11 205 / .5)}
.r-name{font-size:1rem; font-weight:700; letter-spacing:-0.015em; flex:1; min-width:0}
.r-file{font-size:0.625rem; color:var(--cyan); font-family:'SF Mono','Fira Code',ui-monospace,monospace}
.r-pill{font-size:0.625rem; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:4px 10px; border-radius:100px; flex-shrink:0; white-space:nowrap}
.r-pill.off,.r-pill.bad{color:var(--red); background:var(--red-soft)}
.r-pill.warn{color:var(--amber); background:var(--amber-soft)}
.r-pill.odd{color:var(--cyan); background:var(--cyan-soft)}
.r-pill.good{color:var(--green); background:var(--green-soft)}
.r-meta{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px}
.r-field{display:flex; flex-direction:column; gap:2px}
.r-k{font-size:0.5625rem; font-weight:700; text-transform:uppercase; letter-spacing:0.09em; color:var(--text-faint)}
.r-v{font-size:0.8125rem; color:var(--text-mid); font-variant-numeric:tabular-nums}
.r-v.strong{color:var(--text); font-weight:600}
.r-v.alert{color:var(--red)}
.r-v.odd{color:var(--cyan)}
.r-note{font-size:0.6875rem; color:var(--text-muted); margin-top:11px; padding-top:11px; border-top:1px solid var(--hair-soft); line-height:1.45}

.days{display:flex; gap:4px; margin-top:12px}
.day{flex:1; text-align:center; font-size:0.625rem; font-weight:700; padding:5px 0; border-radius:6px; background:var(--surface-2); color:var(--text-faint); letter-spacing:0.02em}
.day.on{background:var(--accent-soft); color:var(--accent)}

.state{text-align:center; padding:48px 20px; color:var(--text-muted); font-size:0.8125rem; line-height:1.55}
.state.err{color:var(--red)}
.skeleton .sk{height:96px; border-radius:var(--r); background:var(--surface-1); margin-bottom:11px; animation:shimmer 1.5s var(--e) infinite}
@keyframes shimmer{0%,100%{opacity:0.55}50%{opacity:0.9}}

footer{flex-shrink:0; text-align:center; padding:30px 16px calc(22px + env(safe-area-inset-bottom))}
.stamp{font-size:0.5625rem; color:var(--text-faint); letter-spacing:0.04em; font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="masthead">
      <div class="title-wrap">
        <h1><span class="glyph">🔁</span> Routines</h1>
        <p class="sub">Reads <code>schedule.md</code> + the <code>last-run</code> stamps live. Nothing to update by hand.</p>
      </div>
      <div class="mast-actions">
        <a class="icon-btn" href="https://github.com/mawizorek/ClickUp_apps/tree/main/routines" target="_blank" rel="noopener" aria-label="Open routines folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-5"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        </a>
        <button class="icon-btn" id="refreshBtn" aria-label="Reload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="windowSlot"></div>

  <p class="sec-label">Routines</p>
  <div id="list">
    <div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </div>
</div>

<footer>
  <span class="stamp">routines-viewer <span id="verStamp"></span> · loaded <span id="refreshStamp">—</span></span>
</footer>

<script>
/* Routines Viewer v2 — 2026-07-27. Renders routines/schedule.md + the
   per-routine routines/last-run/*.txt stamps. Defect history + the full
   reasoning: routines/next-build-spec.md (D1-D6). Don't restate it here.

   THE RULE THIS APP IS BUILT ON:
   DERIVE, DON'T DECLARE — AND NEVER RENDER A GUESS AS A FACT.
   v1 hardcoded a wake timetable that outlived the scheduler, and collapsed an
   unreadable stamp into "never" for three weeks. Both were confident wrong
   answers, which is the worst thing a status board can be. Anything computable
   is computed; anything unreadable says so. No sample-data fallback: an empty
   screen beats an invented one.

   ⚠️ This app and schedule.md are ONE SYSTEM. Changing that table's SHAPE is a
   change to this file. */
const APP_VERSION = 'v2';
const RAW_ROOT  = 'https://raw.githubusercontent.com/mawizorek/ClickUp_apps/main/';
const RAW_BASE  = RAW_ROOT + 'routines/';
const REPO_BASE = 'https://github.com/mawizorek/ClickUp_apps/blob/main/routines/';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_KEYS = { sunday:0, monday:1, tuesday:2, wednesday:3, thursday:4, friday:5, saturday:6, sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };
const DAY_RE = /\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|wed|thu|fri|sat)\b/g;
const RANGE_RE = /\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\s*(?:[-\u2013\u2014]|to)\s*(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/;
const DAY_MS = 86400000;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripMd(s){ return String(s).replace(/\*\*/g,'').replace(/`/g,'').trim(); }
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function niceName(file){
  return file.replace(/\.md$/,'').replace(/-refresh$/,'').replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}) + ' refresh';
}

/* D3: "Thu–Sun" contains the tokens thu + sun but NOT fri/sat, so the plain
   token scan rendered a 4-day routine as 2 days. Ranges expand first. */
function parseDays(cadence){
  const c = stripMd(cadence).toLowerCase();
  const on = new Array(7).fill(false);
  const range = c.match(RANGE_RE);
  if(range){
    const a = DAY_KEYS[range[1]], b = DAY_KEYS[range[2]];
    for(let i=0;i<7;i++){ const d = (a+i)%7; on[d] = true; if(d === b) break; }
    return on;
  }
  let matched = false, m;
  DAY_RE.lastIndex = 0;
  while((m = DAY_RE.exec(c)) !== null){ on[DAY_KEYS[m[1]]] = true; matched = true; }
  return matched ? on : null;
}

/* D4: retirement is read from the EXPLICIT Cadence cell ("inactive"), not
   sniffed out of prose. The dated fallback only catches a row that carries an
   end date and has passed it. Deliberately NOT matching the word "retired" in
   the notes — "replaces the retired X routine" would kill a live row, which is
   the same prose-fragility D4 exists to remove. */
function isInactive(cadence, notes){
  if(/^\s*inactive\s*$/i.test(stripMd(cadence))) return true;
  const m = String(notes).toLowerCase().match(/through\s+(\d{4}-\d{2}-\d{2})/);
  return m ? Date.now() > new Date(m[1]+'T23:59:59').getTime() : false;
}
function isSessionAware(s){ return /session[-\s]?aware/i.test(s); }
function looksLikePath(t){ return /\.txt$/i.test(t) || t.indexOf('/') !== -1; }

/* D2: column 4 became a FILE PATH on 2026-07-05 when stamps moved per-routine;
   v1 kept calling new Date() on it, got NaN, and rendered "never" for 3 weeks.
   Three states, three DISTINCT results. 'unknown' must NEVER collapse into
   'never' — "never run" is a real claim, "couldn't read it" is not the same
   claim, and conflating them IS the bug. */
async function readStamp(cell){
  const raw = stripMd(cell);
  if(!raw) return { state:'unknown' };
  const parse = function(t){
    if(/^never$/i.test(t)) return { state:'never' };
    const d = new Date(t.replace(' ','T') + ':00');
    return isNaN(d.getTime()) ? { state:'unknown' } : { state:'ok', date:d };
  };
  if(!looksLikePath(raw)) return parse(raw);
  try{
    const res = await fetch(RAW_ROOT + raw.replace(/^\/+/,''), { cache:'no-store' });
    if(!res.ok) return { state:'unknown' };
    const txt = (await res.text()).trim();
    return txt ? parse(txt) : { state:'unknown' };
  }catch(e){ return { state:'unknown' }; }
}

function relTime(d){
  const ms = Date.now() - d.getTime(), hrs = Math.floor(ms/3600000);
  if(ms < 0) return 'in the future';
  if(hrs < 1) return 'just now';
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(ms/DAY_MS) + 'd ago';
}
function stampLabel(st){
  if(st.state === 'never')   return 'Never run';
  if(st.state === 'unknown') return 'Unreadable';
  return relTime(st.date) + ' · ' + st.date.toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

function lastOccurrence(days, now){
  for(let i=0;i<7;i++){ const d = startOfDay(now); d.setDate(d.getDate()-i); if(days[d.getDay()]) return d; }
  return null;
}
function nextOccurrence(days, now){
  for(let i=1;i<=7;i++){ const d = startOfDay(now); d.setDate(d.getDate()+i); if(days[d.getDay()]) return d; }
  return null;
}

/* D5: vocabulary matched to the due-math in schedule.md. "Due today" / "Done
   today" / "Active cycle" all implied something fires on a clock. Nothing
   fires. Overdue is the normal resting state here, not an alarm. */
function statusFor(r){
  if(r.inactive) return { cls:'off', pill:'off', label:'Retired' };
  if(r.stamp.state === 'unknown') return { cls:'unknown', pill:'odd', label:'Stamp unreadable' };
  const now = new Date();
  if(r.days && r.sessionAware){
    if(r.days[now.getDay()]) return { cls:'due-soon', pill:'warn', label:'Eligible today' };
    return { cls:'idle', pill:'', label:'Next: ' + DAYS[nextOccurrence(r.days, now).getDay()] };
  }
  if(r.stamp.state === 'never') return { cls:'overdue', pill:'bad', label:'Never run' };
  if(r.days){
    const last = lastOccurrence(r.days, now);
    if(last && r.stamp.date.getTime() < last.getTime()){
      const d = Math.max(1, Math.round((startOfDay(now).getTime() - last.getTime())/DAY_MS));
      return { cls:'overdue', pill:'bad', label:'Overdue ' + d + 'd' };
    }
    return { cls:'recent', pill:'good', label:'Current · next ' + DAYS[nextOccurrence(r.days, now).getDay()] };
  }
  return { cls:'idle', pill:'', label:'No cadence parsed' };
}

function parseTable(md){
  const lines = md.split('\n'), rows = [];
  let inTable = false;
  for(let i=0;i<lines.length;i++){
    const ln = lines[i];
    if(/^\|.*routine file/i.test(ln)){ inTable = true; continue; }
    if(inTable){
      if(/^\|[\s:|-]+\|/.test(ln)) continue;
      if(!/^\|/.test(ln)){ if(rows.length) break; else continue; }
      const cells = ln.split('|').slice(1,-1).map(function(c){return c.trim();});
      if(cells.length >= 4) rows.push({ file:stripMd(cells[0]), cadence:cells[1], notes:stripMd(cells[2]), lastRunCell:cells[3] });
    }
  }
  return rows;
}

/* D1: v1 hardcoded a wake timetable here and never read schedule.md, so it
   outlived the scheduler and kept printing "Ricky wakes once daily at 06:00
   ET" after nothing woke at all. The only fixed text now is the invoke-only
   MODEL (structural, not a schedule); every number is derived from the rows
   just parsed, so this card cannot drift again. Do not put a time in here. */
function renderHeader(routines){
  const active  = routines.filter(function(r){ return !r.inactive; });
  const overdue = active.filter(function(r){ return r.status.cls === 'overdue'; });
  const unknown = active.filter(function(r){ return r.status.cls === 'unknown'; });
  const retired = routines.length - active.length;

  let tally = '<span class="tally">' + active.length + ' active</span>';
  tally += overdue.length ? '<span class="tally bad">' + overdue.length + ' overdue</span>'
                          : '<span class="tally good">all current</span>';
  if(unknown.length) tally += '<span class="tally odd">' + unknown.length + ' unreadable</span>';
  if(retired)        tally += '<span class="tally">' + retired + ' retired</span>';

  document.getElementById('windowSlot').innerHTML =
    '<div class="window-card">'+
      '<div class="wc-label"><span class="wc-dot"></span>How routines run</div>'+
      '<div class="wc-line"><b>Invoke-only</b> — nothing runs on a timer.</div>'+
      '<div class="wc-tally">'+tally+'</div>'+
      '<div class="wc-note">There is no scheduler and no wake window. A routine runs when you invoke Ricky, or when any session is pointed at its runbook. Overdue is the normal resting state, not an alarm — cadence is a staleness threshold, not a firing time.</div>'+
    '</div>';
}

function render(routines){
  const list = document.getElementById('list');
  if(!routines.length){ list.innerHTML = '<div class="state">No routines found in <code>schedule.md</code>.</div>'; return; }
  routines.sort(function(a,b){ return (a.inactive?1:0)-(b.inactive?1:0); });
  list.innerHTML = routines.map(function(r){
    const st = r.status;
    const daysHtml = (r.days && !r.inactive)
      ? '<div class="days">' + DAYS.map(function(d,i){ return '<div class="day'+(r.days[i]?' on':'')+'">'+d+'</div>'; }).join('') + '</div>'
      : '';
    const vCls = r.stamp.state === 'unknown' ? ' odd' : (st.cls === 'overdue' ? ' alert' : '');
    return '<div class="routine'+(r.inactive?' inactive':'')+'">'+
      '<div class="r-top">'+
        '<span class="r-status '+st.cls+'"></span>'+
        '<div style="flex:1;min-width:0"><div class="r-name">'+esc(r.name)+'</div>'+
          '<a class="r-file" href="'+REPO_BASE+esc(r.file)+'" target="_blank" rel="noopener">'+esc(r.file)+'</a></div>'+
        '<span class="r-pill'+(st.pill?' '+st.pill:'')+'">'+esc(st.label)+'</span>'+
      '</div>'+
      daysHtml+
      '<div class="r-meta">'+
        '<div class="r-field"><span class="r-k">Cadence</span><span class="r-v strong">'+esc(r.cadence)+'</span></div>'+
        '<div class="r-field"><span class="r-k">Last run</span><span class="r-v'+vCls+'">'+esc(stampLabel(r.stamp))+'</span></div>'+
      '</div>'+
      (r.notes ? '<div class="r-note">'+esc(r.notes)+'</div>' : '')+
    '</div>';
  }).join('');
}

async function init(){
  document.getElementById('verStamp').textContent = APP_VERSION;
  document.getElementById('refreshStamp').textContent = new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  try{
    const res = await fetch(RAW_BASE + 'schedule.md', { cache:'no-store' });
    if(!res.ok) throw new Error('schedule.md ' + res.status);
    const rows = parseTable(await res.text());
    const routines = await Promise.all(rows.map(async function(row){
      const r = {
        file: row.file, name: niceName(row.file), cadence: stripMd(row.cadence), notes: row.notes,
        days: parseDays(row.cadence),
        sessionAware: isSessionAware(row.cadence + ' ' + row.notes),
        inactive: isInactive(row.cadence, row.notes),
        stamp: await readStamp(row.lastRunCell)
      };
      r.status = statusFor(r);
      return r;
    }));
    renderHeader(routines);
    render(routines);
  }catch(e){
    /* D6: no sample fallback. A status board that invents plausible rows when
       it can't reach its source is a lie generator. Say nothing instead. */
    document.getElementById('windowSlot').innerHTML = '';
    document.getElementById('list').innerHTML =
      '<div class="state err">Couldn\'t load <code>routines/schedule.md</code>.<br><br>'+
      'Showing nothing on purpose — a stale sample would be worse than an empty screen.</div>';
  }
}

const refreshBtn = document.getElementById('refreshBtn');
refreshBtn.addEventListener('click', async function(){
  if(refreshBtn.classList.contains('spinning')) return;
  refreshBtn.classList.add('spinning');
  await init();
  setTimeout(function(){ refreshBtn.classList.remove('spinning'); }, 400);
});
init();
</script>
</body>
</html>
