<!-- Inciardi Collection — v20. THE SHELL. Markup + script tags. Nothing else.

     ============================================================================
     🔴 THE MODULE MAP, and the two rules that produced it.

     RULE 1 — nothing that must be read back whole exceeds the budget:
     **~12KB target · 15KB split line · 22KB ceiling · 30KB hard tool cap.** Base64 inflates 4/3,
     so 22KB on disk is ~29KB returned. A file that cannot be read whole cannot be safely edited.
     Math: `brain-config/hooks/source-size-budget-enforcer.md`.

     RULE 2 — **`index.html` is an INDEX** (architecture lock, 2026-07-08): a thin shell that
     references pages, never a file storing servable content.

     ⚠️ EVERY NUMBER BELOW WAS MEASURED FROM A DIRECTORY LISTING AT v20, NOT ESTIMATED. v17
     shipped this map with guessed sizes and three were wrong by 3-5KB. **A size map with invented
     numbers is worse than no map, because the whole point of it is deciding when to split, and a
     guess reads exactly like a measurement.** Re-measure when you touch this. (This file does not
     list its own size: a file cannot state its own length without being wrong the moment it does.)

       device.js    2.9KB  mobile vs desktop, one owner     → Device
       app.js       5.4KB  routing only                     → App
       picker.js    6.6KB  the slot entry surface           → Picker
       sheets.js    6.3KB  reorder · rename · add           → Sheets
       enter.js     8.1KB  entry form + shoe-box            → Enter, Shoebox
       settings.js  9.2KB  the settings panel               → Settings
       core.js      9.6KB  API client · Drawer · helpers    → API, Core, Drawer
       artwork.js  10.6KB  one print, in full               → Artwork
       batch.js    10.9KB  loads + VALIDATES a batch file   → Batch
       photos.js   11.7KB  the photo bank, unassigned first → Photos        (v20, new)
       capture.js  11.9KB  shoot · re-encode · upload       → Capture       (v20, new)
       chrome.js   12.2KB  header · nav · scrim · footer    → Chrome
       preview.js  12.9KB  the back room's markup           → Preview
       binder.js   15.0KB  the stage, faces, turning        → Binder
       arrange.js  15.8KB  WHERE each print sits, editable  → Arrange       ⚠️ over the line
       backroom.js 16.5KB  choose · read · decide · write   → Backroom      ⚠️ over the line
       boot.js     17.5KB  config · theme · router · settings wiring · diagnostics  ⚠️ over

       styles.css   1.2KB  pointers only, zero colour literals
       sheets.css   3.5KB  sheet list · legend
       photos.css   5.1KB  the grid · scope chips · photo drawer            (v20, new)
       artwork.css  8.4KB  the print page + the picker's door to it
       summary.css 10.5KB  the matrix
       chrome.css  13.2KB  header · drawers · footer
       base.css    14.7KB  type · forms · lists · toasts · touch-action
       binder.css  15.1KB  stage · cards · deck bar                         ⚠️ over the line
       backroom.css 16.3KB headline · arrangement grid · validator · verdict table · log ⚠️ over

       worker/sheets.js  8.1KB  binder mechanics: create · rename · reorder
       worker/adopt.js  11.3KB  the legacy 177 import + the bucket diagnostic
       worker/reads.js  15.5KB  the seven GET routes
       worker/worker.js 16.7KB  the gate · the dispatch table · artwork/copy/slot writes
       worker/images.js 21.0KB  upload · serve · list · assign · primary · archive  🔴 SEE BELOW

     🔴 `worker/images.js` IS 21,455 BYTES — ~545 OF HEADROOM AGAINST THE 22KB CEILING, AND THE
     COMMIT THAT SHIPPED IT CLAIMED "~20.6KB". That number was estimated, not read back, in a
     commit whose entire subject was repairing a file for being over the line. It is the SAME
     SHAPE as `worker.js` at 674 bytes of headroom, and the same shape as the v17 map. **THE NEXT
     IMAGE ROUTE DOES NOT GO IN THAT FILE.** Named seam: the three JSON writes (`assign`,
     `primary`, `archive`) are self-contained and share nothing with the byte paths but a route
     prefix — they become `worker/links.js`.

     ⚠️ SEVEN FILES ARE OVER THE 15KB SPLIT LINE, all still under the 22KB ceiling — so all seven
     read whole and edit safely, which is the line that actually matters. Named seams:
       boot.js     → `diag.js` (bundle + ping + copy are a self-contained reporting concern).
                     The most overdue split in the front end, and now a version older.
       binder.css  → `card.css` (the .slot block is a third of the file)
       backroom.css → `arrange.css` (the grid block is self-contained)
       arrange.js  → nothing yet. One feature, mostly comment; trim before splitting.
       backroom.js → PLAN vs APPLY. ⚠️ DODGED FOUR TIMES NOW (v15 markup, v17 arrangement, v19 and
                     v20 not touched at all). The stated reason — never refactor the write path on
                     a day someone is about to use it — is real and does not expire. It is also
                     the longest-standing debt in the app.

     🔴 v20 GAVE THE PHOTO PIPE A FACE. Nine worker routes shipped earlier the same day and
     nothing Michael could see had changed; `photos.js` + `capture.js` are the half he touches.
     UNASSIGNED IS THE DEFAULT VIEW (Q19 + J15) for the same reason the shoe-box is a screen and
     not a filter: a backlog you have to go looking for is a backlog nobody clears.
     ⚠️ `capture.js` reads EXIF `shot_at` BEFORE the canvas re-encode, because the re-encode
     strips GPS — which is the point — and takes the capture date with it, permanently and
     invisibly (J16).
     ⚠️ STILL NOT BUILT: the carousel on a print's own page. `artwork.js` was not touched, so
     `#artwork?id=` still renders the sized empty block v19 left for it. That is the next step,
     deliberately not smuggled into the commit that built the surface.

     🔴 THREE ROUTE CLASSES, and the third exists because the other two are both MENUS.
     `APP.nav` draws the drawer; `APP.hidden` draws the settings footer link; **`APP.detail` draws
     nowhere** — a detail route needs a param, so any menu row pointing at one is permanently
     broken. All three must be listed in boot.js's `routes` or the router silently falls back to
     the binder, and all three must be titled in chrome.js or the header shows the app name.

     🔴 HOW IT WENT WRONG ORIGINALLY, because the mechanism matters more than the numbers: v4 added
     the sheet menu, v5 the stage, v6 traversal, v7 the shoe-box split — four reasonable changes,
     one file, no moment anyone would have called it a problem. `app.js` hit 32.7KB, `styles.css`
     30KB. Size Sally forecasts exactly this and Dev Dexter owns the split law; both are
     invoke-only and neither was seated across those four versions. A guardrail that needs
     remembering is not a guardrail — which is why the answer is a DEFAULT SHAPE, not a fifth gate.
     ============================================================================

     ⚠️ BUMP `?v=` ON BOTH CSS AND JS. Housekeeping at v17, load-bearing at v18 (the whole change
     was a stylesheet), load-bearing at v19 (a cached `boot.js` had no `APP.detail`), and
     load-bearing again at v20 for the same reason one version on: a cached `boot.js` has no
     `photos` route, so `#photos` would silently fall back to the binder and read as a dead nav
     row rather than a stale cache. The build stamp in the footer is how a screenshot says which
     code is running — and `boot.js` → `version` must be bumped in the SAME commit as this
     comment, because v17 shipped with the two disagreeing.

     ⚠️ STILL NOT BUILT: no `manifest.webmanifest`, no `apple-mobile-web-app-capable`. A
     home-screen icon today opens in the browser WITH its address bar, and Android will not offer
     to install this. If the standalone app is wanted it is a manifest, an icon set, a display
     mode — and a version check on resume, because standalone has no reload button either. -->
<html lang="en" data-theme="mercedes" data-mode="dark">
<head>
<meta charset="utf-8">
<!-- ⚠️ DO NOT ADD `maximum-scale` OR `user-scalable=no` HERE. See the v18 note in git history: the
     zoom misfire is solved in base.css with `touch-action`, and a viewport scale lock is both
     ineffective on iOS and an accessibility regression everywhere else. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Mercedes surface-1. Paints the iOS browser chrome; settings.js moves it with the mode toggle,
     reading the resolved token rather than a hardcoded hex. -->
<meta name="theme-color" content="#192221">
<meta name="robots" content="noindex, nofollow">
<!-- Chrome.setActive() rewrites this per route ("Binder · Inciardi Collection"). This is the
     pre-JS value, so it has to stand alone. -->

<meta name="description" content="A digital twin of the mini-print binder: sheets, faces, slots.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128213;</text></svg>">

<!-- ORDER: device.js FIRST — it sets `data-device` on <html>, and CSS layout depends on that
     attribute being present before the stage paints. Then core.js (everything needs it), then the
     screen modules, then boot.js last because it calls Chrome.init and the router.
     ⚠️ settings.js only has to be PARSED before boot.js runs Chrome.init; it sits next to
     chrome.js because the two are halves of one thing. If it 404s, chrome.js builds a drawer that
     says so and boot.js skips its wiring — a missing panel, not a blank app.
     ⚠️ batch.js is a LOADER, not data — the batches themselves are JSON fetched at mount. It,
     arrange.js and preview.js only need to be parsed before backroom.js mounts; app.js names all
     four in NEEDS, and backroom.js refuses to render without them, naming the missing file.
     ⚠️ artwork.js is reached by LINK, never by menu, so a 404 on it shows up as a broken tap from
     the picker rather than a missing nav row. app.js names it in NEEDS for exactly that reason.
     ⚠️ capture.js BEFORE photos.js, and it is not alphabetical politeness: `Photos.mount()` wires
     the Add-photos button straight to `Capture.pick`, and app.js names Capture in the photos
     route's NEEDS so a 404 on it reports the file instead of rendering a button that does
     nothing. It is also the shared half — the print page's own camera button will call the same
     module, which is why it is not folded into photos.js. -->
