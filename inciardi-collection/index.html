     🔴 v22 — THE CAROUSEL, AND ONE ORDERING WITH ONE OWNER.
     A print's own page finally shows its photographs: hero, filmstrip, full-screen viewer,
     camera, and a picker for attaching a photo you already took. **Q16's condition — accepted
     2026-07-25, unbuilt for seven days — is met.**
     🔴 THE FIRST FRAME IS THE BINDER CARD'S PHOTO, STRUCTURALLY. `GET /images?artwork=` runs the
     same `photoOrder()` the card runs, with the `LIMIT 1` taken off. Nothing on the client sorts
     that list and nothing may start: a client-side ordering is the second claimant that lets two
     surfaces disagree about which photograph a print IS.
     🔴 ⭐ IS NOW A VERB, NOT A STATE (Q26, Michael: *"can starring it just push it to top? so its
     an undoable trigger and not a state? derivable is best"*). `is_primary` is retired from the
     ranking in favour of `edition_image.sort`; "put on the card" writes MIN(sort)-1 and you undo
     it by putting a different photo there. The column is not dropped — that is migration 002 —
     but nothing reads it and nothing writes a 1.
     ⚠️ `GET /images` still returns `is_primary_anywhere` and it is now MEANINGLESS. `photos.js`
     reads it; that is the next UI touch, not this one.
     ⚠️ PINCH-ZOOM: `viewer.js` abandons swipe tracking the instant a second finger appears, and
     calls `preventDefault` nowhere. J17 protected pinch for exactly this screen; do not undo it
     from the JavaScript side.

     🔴 v21 — THE PHOTOGRAPH REACHED THE BINDER, and the rule behind it is Michael's:
     *"if a photo is the ONLY photo attached, it should be the default render even if not
     selected."* A DERIVE where the proposal was a WRITE — rung 1 against rung 2 — and it cannot
     fall out of date with its own inputs.
     ⚠️ The card's `<img>` STACKS OVER the initials rather than replacing them, so a failed image
     reveals the letters instead of a grey box. Do not "tidy" that away; it is the only fallback.
     ⚠️ A `wanted` slot renders NO photograph on purpose — see `binder.css`. Filling the ghost
     would make the wishlist look like the collection.

     🔴 v20 GAVE THE PHOTO PIPE A FACE. `photos.js` + `capture.js`. UNASSIGNED IS THE DEFAULT VIEW
     (Q19 + J15) for the same reason the shoe-box is a screen and not a filter: a backlog you have
     to go looking for is a backlog nobody clears.
     ⚠️ `capture.js` reads EXIF `shot_at` BEFORE the canvas re-encode, because the re-encode strips
     GPS — which is the point — and takes the capture date with it, permanently and invisibly
     (J16). ✅ Verified on Michael's first six real uploads: six true 07-25 capture dates.

     🔴 THREE ROUTE CLASSES, and the third exists because the other two are both MENUS.
     `APP.nav` draws the drawer; `APP.hidden` draws the settings footer link; **`APP.detail` draws
     nowhere** — a detail route needs a param, so any menu row pointing at one is permanently
     broken. All three must be listed in boot.js's `routes` or the router silently falls back to
     the binder, and all three must be titled in chrome.js or the header shows the app name.
