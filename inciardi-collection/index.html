     🔴 THE MODULE MAP, and the two rules that produced it.

     RULE 1 — nothing that must be read back whole exceeds the budget:
     **~12KB target · 15KB split line · 22KB ceiling · 30KB hard tool cap.** Base64 inflates 4/3,
     so 22KB on disk is ~29KB returned. A file that cannot be read whole cannot be safely edited.

     RULE 2 — **`index.html` is an INDEX** (architecture lock, 2026-07-08): a thin shell that
     references pages, never a file storing servable content.

     exactly like a measurement.** Re-measure when you touch this. (This file does not list its
     own size: a file cannot state its own length without being wrong the moment it does.)

     🔴 v23 — THE PRINT PAGE HAS ITS PHOTOGRAPHS, AND THE VIEWER IS NOT IN IT.
     Q28 came back with all four options unstruck plus *"want seemless photo integration and
     linking driven from single source with access across the board"* — read as the CONSTRAINT on
     the four rather than a fifth item. So the carousel is NOT a function inside `artwork.js`; it
     is `photoview.js`, a module with no page, which `photos.js` can also call. artwork.js renders
     `<div id="awPhotos">` and knows nothing else about photographs.
     ⚠️ `photos.js` DOES NOT CALL IT YET. Two lines, deliberately not smuggled into the commit
     that created the thing it would call. Seam built and named.
     🔴 PINCH-ZOOM IS DEFENDED THREE WAYS in that file — the swipe handler abandons on a second
     touch point, `touch-action: pan-y pinch-zoom` splits the axes in CSS, and `gesturestart` is
     never touched. J17 refused a global zoom fix specifically to protect this screen. Do not
     spend that.

     🔴 v22 — ONE ORDERING, ONE OWNER; THE STAR IS A VERB.
     `photoOrder()` lives once, in `worker/links.js`, and BOTH `reads.js` (card, `LIMIT 1`) and
     `images.js` (carousel, no limit) import it — so the card photo IS the carousel's first frame
     structurally, not by two files being kept in step. `is_primary` is retired from the ranking
     in favour of `edition_image.sort`: starring writes `MIN(sort)-1`, and you undo it by starring
     something else. Q26, on Michael's note *"an undoable trigger and not a state? derivable is
     best."* ⚠️ The column still exists and is meaningless; it goes with migration 002.

     🔴 THREE ROUTE CLASSES, and the third exists because the other two are both MENUS.
     `APP.nav` draws the drawer; `APP.hidden` draws the settings footer link; **`APP.detail` draws
     nowhere** — a detail route needs a param, so any menu row pointing at one is permanently
     broken. All three must be listed in boot.js's `routes` or the router silently falls back to
     the binder, and all three must be titled in chrome.js or the header shows the app name.

     🔴 HOW IT WENT WRONG ORIGINALLY, because the mechanism matters more than the numbers: v4 added
     the sheet menu, v5 the stage, v6 traversal, v7 the shoe-box split — four reasonable changes,
     one file, no moment anyone would have called it a problem. `app.js` hit 32.7KB, `styles.css`
     30KB. Size Sally forecasts exactly this and Dev Dexter owns the split law; both are
     invoke-only and neither was seated across those four versions. A guardrail that needs
     remembering is not a guardrail — which is why the answer is a DEFAULT SHAPE, not a fifth gate.
     ============================================================================

     ⚠️ BUMP `?v=` ON BOTH CSS AND JS. Housekeeping at v17, load-bearing at v18 (the whole change

     and shows no photographs; a cached `artwork.js` has no `#awPhotos`, so PhotoView mounts into
     null and the section is simply absent. Either stale half reads as "the carousel was never
     built" rather than as a stale asset.
     The build stamp in the footer is how a screenshot says which code is running — and `boot.js`
     → `version` must be bumped in the SAME commit as this comment, because v17 shipped with the

<html lang="en" data-theme="mercedes" data-mode="dark">
<head>
<meta charset="utf-8">
<!-- ⚠️ DO NOT ADD `maximum-scale` OR `user-scalable=no` HERE. See the v18 note in git history: the
     zoom misfire is solved in base.css with `touch-action`, and a viewport scale lock is both
     ineffective on iOS and an accessibility regression everywhere else. As of v23 there is a
     second reason: the full-screen photo viewer is built around pinch, so a scale lock would
     break a shipped feature rather than just an unbuilt one. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ORDER: device.js FIRST — it sets `data-device` on <html>, and CSS layout depends on that
     attribute being present before the stage paints. Then core.js (everything needs it), then the
     screen modules, then boot.js last because it calls Chrome.init and the router.
     ⚠️ settings.js only has to be PARSED before boot.js runs Chrome.init; it sits next to
     chrome.js because the two are halves of one thing. If it 404s, chrome.js builds a drawer that
     says so and boot.js skips its wiring — a missing panel, not a blank app.
     ⚠️ batch.js is a LOADER, not data — the batches themselves are JSON fetched at mount. It,
     arrange.js and preview.js only need to be parsed before backroom.js mounts; app.js names all
     four in NEEDS, and backroom.js refuses to render without them, naming the missing file.
     ⚠️ artwork.js is reached by LINK, never by menu, so a 404 on it shows up as a broken tap from
     the picker rather than a missing nav row. app.js names it in NEEDS for exactly that reason.
     ⚠️ capture.js BEFORE photos.js AND before photoview.js — both call `Capture.pick`, and app.js
     names Capture in the NEEDS of both routes so a 404 reports the file instead of rendering a
     button that does nothing.
     ⚠️ photoview.js BEFORE artwork.js is NOT required (artwork.js only reaches for `PhotoView` at
     mount, long after parse) but it is listed first anyway, because the reverse invites someone
     to "fix" a non-existent ordering bug later. Cheap to be obvious. -->
