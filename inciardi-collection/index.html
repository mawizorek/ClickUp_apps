<!doctype html>
<!-- Inciardi Collection — v18. THE SHELL. Markup + script tags. Nothing else.

     ============================================================================
     🔴 THE MODULE MAP, and the two rules that produced it.

     RULE 1 — nothing that must be read back whole exceeds the budget:
     **~12KB target · 15KB split line · 22KB ceiling · 30KB hard tool cap.** Base64 inflates 4/3,
     so 22KB on disk is ~29KB returned. A file that cannot be read whole cannot be safely edited.
     Math: `brain-config/hooks/source-size-budget-enforcer.md`.

     RULE 2 — **`index.html` is an INDEX** (architecture lock, 2026-07-08): a thin shell that
     references pages, never a file storing servable content.

     ⚠️ EVERY NUMBER BELOW WAS MEASURED AT v18, NOT ESTIMATED. The v17 commit shipped this map
     with guessed sizes and three of them were wrong by 3-5KB — `arrange.js` was written down as
     ~11KB and is 15.8KB. **A size map with invented numbers is worse than no map, because the whole
     point of it is deciding when to split, and a guess reads exactly like a measurement.** Re-read
     the directory listing when you touch this. (This file does not list its own size: a file cannot
     state its own length without being wrong the moment it says so.)

       device.js    2.9KB  mobile vs desktop, one owner     → Device
       app.js       4.1KB  routing only                     → App
       picker.js    4.5KB  the slot entry surface           → Picker
       sheets.js    6.3KB  reorder · rename · add           → Sheets
       enter.js     8.1KB  entry form + shoe-box            → Enter, Shoebox
       settings.js  9.2KB  the settings panel               → Settings
       core.js      9.6KB  API client · Drawer · helpers    → API, Core, Drawer
       batch.js    10.9KB  loads + VALIDATES a batch file   → Batch
       chrome.js   11.7KB  header · nav · scrim · footer    → Chrome
       preview.js  12.9KB  the back room's markup           → Preview
       boot.js     14.8KB  config · theme · router · settings wiring · diagnostics
       binder.js   15.0KB  the stage, faces, turning        → Binder
       arrange.js  15.8KB  WHERE each print sits, editable  → Arrange       ⚠️ over the line
       backroom.js 16.5KB  choose · read · decide · write   → Backroom      ⚠️ over the line

       styles.css   1.2KB  pointers only, zero colour literals
       sheets.css   3.5KB  sheet list · legend
       summary.css 10.5KB  the matrix
       chrome.css  13.2KB  header · drawers · footer
       base.css    14.7KB  type · forms · lists · toasts · TOUCH-ACTION (v18, +2.1KB)
       binder.css  15.1KB  stage · cards · deck bar                         ⚠️ over the line
       backroom.css 16.3KB headline · arrangement grid · validator · verdict table · log ⚠️ over

       batches/    DATA, NOT CODE. One .json per physical sheet, plus `_index.json` listing them.
                   Fetched at runtime, never bundled, never parsed as JavaScript. The size budget
                   does not apply — nothing has to read a batch file whole to edit it safely,
                   because editing one cannot break the app. Procedure for adding one:
                   `brain-config/hooks/batch-import.md`.

     🔴 v16 MOVED THE RISKIEST INPUT OUT OF CODE. Until then a new sheet meant editing `batch.js`:
     transcribing a photograph was a JavaScript edit, in the file that feeds an irreversible bulk
     write, where a stray brace is a parse error. Now the transcript is inert JSON, validated
     before anything is sent, and the loader is a file nobody has to touch again.

     🔴 v17 GAVE THE TRANSCRIPT A SECOND CHANCE, WHICH IS A DIFFERENT PROBLEM FROM VALIDATING IT.
     `batch.js` proves a batch is WELL FORMED. Nothing could prove it was TRUE — and the ice-cream
     sheet imported eighteen cards 90° out of true past a green validator, because the confirm
     screen listed rows (`front 1 Ninja Turtle`) rather than showing the sheet. `arrange.js` adds
     the 3x3 grid AND the ability to fix it in place: rotate, mirror, swap faces, swap two pockets.
     Michael: "the preview grid is only helpful if i can edit it."
     ⚠️ It edits the RUN, never the FILE — a static site cannot write to the repo. So a dirty
     arrangement warns, loudly, and hands over the corrected JSON to paste back. Read the hazard
     note in `arrange.js`; the short version is that slots are written ON CONFLICT DO UPDATE, so an
     unfixed batch file can silently undo a corrected import on the next run.

     🔴 v18 IS ONE CSS RULE, AND THE INTERESTING PART IS THE THREE FIXES IT IS NOT.
     Speed-tapping the deck-bar turn arrows on a phone triggered iOS double-tap zoom mid-turn.
     The fix is `touch-action: manipulation` in `base.css` — on interactive elements and on the
     whole `body.stage`, which does not scroll and has no text to zoom into. NOT DONE, and each
     for a stated reason recorded there in full: `user-scalable=no` on the viewport tag (iOS
     Safari has ignored it since iOS 10 — it would have looked like a fix and done nothing), a
     `gesturestart` preventDefault (kills PINCH everywhere, including the 1800px print carousel
     the image work is being designed around), and a universal `* { touch-action }` (would reach
     `.plate` and every image that lands on it — the one surface that must keep pinch).
     ⚠️ THE VIEWPORT TAG BELOW IS DELIBERATELY UNTOUCHED. If a future session "fixes zoom" by
     adding `maximum-scale=1` or `user-scalable=no` to it, that is a regression twice over: it
     does nothing on iOS and it is an accessibility loss on everything else.
     ============================================================================

     ⚠️ THE `?v=` BUMP WAS HOUSEKEEPING AT v17 AND IS LOAD-BEARING AGAIN AT v18, for a new reason:
     the entire v18 change IS a stylesheet, so a cached `base.css` serves the bug and the build
     stamp would still read v18. Bump the CSS, not just the JS. (The v14 hazard — a cached
     `batch.js` writing the WRONG arrangement into D1 — is separately dead: batch data is fetched
     `no-store` and cannot be served stale at all.) The build stamp stays on the run screen
     because it still answers "which CODE is running."

     ⚠️ STILL NOT BUILT: no `manifest.webmanifest`, no `apple-mobile-web-app-capable`. A
     home-screen icon today opens in the browser WITH its address bar, and Android will not offer
     to install this. If the standalone app is wanted it is a manifest, an icon set, a display
     mode — and a version check on resume, because standalone has no reload button either. -->
<html lang="en" data-theme="mercedes" data-mode="dark">
<head>
<meta charset="utf-8">
<!-- ⚠️ DO NOT ADD `maximum-scale` OR `user-scalable=no` HERE. See the v18 block above: the zoom
     misfire is solved in base.css with `touch-action`, and a viewport scale lock is both
     ineffective on iOS and an accessibility regression everywhere else. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Mercedes surface-1. Paints the iOS browser chrome; settings.js moves it with the mode toggle,
     reading the resolved token rather than a hardcoded hex. -->
<meta name="theme-color" content="#192221">
<meta name="robots" content="noindex, nofollow">
<!-- Chrome.setActive() rewrites this per route ("Binder · Inciardi Collection"). This is the
     pre-JS value, so it has to stand alone. -->
<title>Inciardi Collection</title>
<meta name="description" content="A digital twin of the mini-print binder: sheets, faces, slots.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128213;</text></svg>">
<link rel="stylesheet" href="../shared/themes/themes.css">
<link rel="stylesheet" href="./base.css?v=18">
<link rel="stylesheet" href="./chrome.css?v=18">
<link rel="stylesheet" href="./binder.css?v=18">
<link rel="stylesheet" href="./sheets.css?v=18">
<link rel="stylesheet" href="./summary.css?v=18">
<link rel="stylesheet" href="./backroom.css?v=18">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<!-- chrome.js fills these three. The nav drawer, settings drawer and scrim are appended to <body>
     by chrome.js and settings.js, so they are not in this file either. -->
<header id="appHeader"></header>
<main id="view" tabindex="-1"></main>
<footer id="appFooter"></footer>

<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript>This app needs JavaScript enabled.</noscript>

<!-- ORDER: device.js FIRST — it sets `data-device` on <html>, and CSS layout depends on that
     attribute being present before the stage paints. Then core.js (everything needs it), then the
     screen modules, then boot.js last because it calls Chrome.init and the router.
     ⚠️ settings.js only has to be PARSED before boot.js runs Chrome.init; it sits next to
     chrome.js because the two are halves of one thing. If it 404s, chrome.js builds a drawer that
     says so and boot.js skips its wiring — a missing panel, not a blank app.
     ⚠️ batch.js is a LOADER, not data — the batches themselves are JSON fetched at mount. It,
     arrange.js and preview.js only need to be parsed before backroom.js mounts; app.js names all
     four in NEEDS, and backroom.js refuses to render without them, naming the missing file. -->
<script src="../shared/themes/resolve.js"></script>
<script src="./device.js?v=18"></script>
<script src="./core.js?v=18"></script>
<script src="./chrome.js?v=18"></script>
<script src="./settings.js?v=18"></script>
<script src="./binder.js?v=18"></script>
<script src="./sheets.js?v=18"></script>
<script src="./picker.js?v=18"></script>
<script src="./enter.js?v=18"></script>
<script src="./summary.js?v=18"></script>
<script src="./batch.js?v=18"></script>
<script src="./arrange.js?v=18"></script>
<script src="./preview.js?v=18"></script>
<script src="./backroom.js?v=18"></script>
<script src="./app.js?v=18"></script>
<script src="./boot.js?v=18"></script>
</body>
</html>
