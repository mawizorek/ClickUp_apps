<!doctype html>
<!-- Inciardi Collection — v16. THE SHELL. Markup + script tags. Nothing else.

     ============================================================================
     🔴 THE MODULE MAP, and the two rules that produced it.

     RULE 1 — nothing that must be read back whole exceeds the budget:
     **~12KB target · 15KB split line · 22KB ceiling · 30KB hard tool cap.** Base64 inflates 4/3,
     so 22KB on disk is ~29KB returned. A file that cannot be read whole cannot be safely edited.
     Math: `brain-config/hooks/source-size-budget-enforcer.md`.

     RULE 2 — **`index.html` is an INDEX** (architecture lock, 2026-07-08): a thin shell that
     references pages, never a file storing servable content.

       core.js      9.6KB  API client · Drawer · helpers    → API, Core, Drawer
       device.js    2.9KB  mobile vs desktop, one owner     → Device
       chrome.js   11.7KB  header · nav · scrim · footer    → Chrome
       settings.js  9.2KB  the settings panel               → Settings
       binder.js   15.0KB  the stage, faces, turning        → Binder
       sheets.js    6.3KB  reorder · rename · add           → Sheets
       picker.js    4.5KB  the slot entry surface           → Picker
       enter.js     8.1KB  entry form + shoe-box            → Enter, Shoebox
       summary.js  14.9KB  the collection matrix            → Summary
       batch.js    12.4KB  loads + VALIDATES a transcript   → Batch
       preview.js  11.0KB  the back room's markup           → Preview
       backroom.js 13.9KB  choose · read · decide · write   → Backroom
       app.js       4.4KB  routing only                     → App
       boot.js     14.7KB  config · theme · router · settings wiring · diagnostics

       base.css    12.6KB  type · forms · lists · toasts
       chrome.css  13.2KB  header · drawers · footer
       binder.css  15.1KB  stage · cards · deck bar
       sheets.css   3.5KB  sheet list · legend
       summary.css 10.5KB  the matrix
       backroom.css 9.5KB  chooser · headline · verdict table · problems · log

     🔴 AND ONE DIRECTORY THAT IS NOT SOURCE AT ALL:

       batches/_index.json   the manifest of available transcripts
       batches/<slug>.json   ONE TRANSCRIBED SHEET — pure data, no code

     v16 drew that line on purpose (Michael: "ideally jst a reference data file so they're never
     actualyl touchuing code"). A transcript used to be a .js file, which made every new sheet a
     code edit performed by whoever was reading photographs — and one stray quote took the whole
     app down with a MISSING-MODULE error for a file that was present and one character wrong.
     Nothing under `batches/` can do that. The size budget does not apply there either; those
     files are read by a fetch, not by a person editing them whole.
     Procedure for producing one: `brain-config/hooks/binder-sheet-intake.md`.

     ⚠️ AT THE LINE: binder.css 15.1KB, binder.js 15.0KB, summary.js 14.9KB, boot.js 14.7KB,
     backroom.js 13.9KB. Named seams, so nobody has to find them under pressure:
       binder.css  → `card.css` (the .slot block is a third of the file)
       summary.js  → `matrix.js` + `drill.js`
       boot.js     → `diag.js` (bundle + ping + copy are a self-contained reporting concern)
       backroom.js → PLAN vs APPLY (preflight/build | apply/chain/log; they share two variables)
     🔴 AND THE REAL OFFENDER IS `worker/worker.js` AT 29.3KB — one byte under the hard read cap,
     so every edit to it is a full retype of a file too big to verify. That is the next split in
     this app, before any new route. Seam: `worker/reads.js` (the six GETs; /summary and /shoebox
     are ~10KB between them) leaving the shell plus the writes.

     🔴 HOW IT WENT WRONG, because the mechanism matters more than the numbers: v4 added the sheet
     menu, v5 the stage, v6 traversal, v7 the shoe-box split — four reasonable changes, one file,
     no moment anyone would have called it a problem. `app.js` hit 32.7KB, `styles.css` 30KB.
     Size Sally forecasts exactly this and Dev Dexter owns the split law; both are invoke-only and
     neither was seated across those four versions. A guardrail that needs remembering is not a
     guardrail — which is why the answer is a DEFAULT SHAPE, not a fifth gate.
     ============================================================================

     ⚠️ STILL NOT BUILT: no `manifest.webmanifest`, no `apple-mobile-web-app-capable`. A
     home-screen icon today opens in the browser WITH its address bar, and Android will not offer
     to install this. If the standalone app is wanted it is a manifest, an icon set, a display
     mode — and a version check on resume, because standalone has no reload button either. -->
<html lang="en" data-theme="mercedes" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Mercedes surface-1. Paints the iOS browser chrome; settings.js moves it with the mode toggle,
     reading the resolved token rather than a hardcoded hex. -->
<meta name="theme-color" content="#192221">
<meta name="robots" content="noindex, nofollow">
<!-- Chrome.setActive() rewrites this per route ("Binder · Inciardi Collection"). This is the
     pre-JS value, so it has to stand alone. -->
<title>Inciardi Collection</title>
<meta name="description" content="A digital twin of the mini-print binder: sheets, faces, slots.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128213;</text></svg>">
<link rel="stylesheet" href="../shared/themes/themes.css">
<link rel="stylesheet" href="./base.css?v=16">
<link rel="stylesheet" href="./chrome.css?v=16">
<link rel="stylesheet" href="./binder.css?v=16">
<link rel="stylesheet" href="./sheets.css?v=16">
<link rel="stylesheet" href="./summary.css?v=16">
<link rel="stylesheet" href="./backroom.css?v=16">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<!-- chrome.js fills these three. The nav drawer, settings drawer and scrim are appended to <body>
     by chrome.js and settings.js, so they are not in this file either. -->
<header id="appHeader"></header>
<main id="view" tabindex="-1"></main>
<footer id="appFooter"></footer>

<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript>This app needs JavaScript enabled.</noscript>

<!-- ORDER: device.js FIRST — it sets `data-device` on <html>, and CSS layout depends on that
     attribute being present before the stage paints. Then core.js (everything needs it), then the
     screen modules, then boot.js last because it calls Chrome.init and the router.
     ⚠️ settings.js only has to be PARSED before boot.js runs Chrome.init; it sits next to
     chrome.js because the two are halves of one thing. If it 404s, chrome.js builds a drawer that
     says so and boot.js skips its wiring — a missing panel, not a blank app.
     ⚠️ batch.js + preview.js BEFORE backroom.js. Note that batch.js no longer CONTAINS a batch —
     it fetches one at mount time from `batches/`, so a missing transcript is now a message on
     that screen rather than a missing global. app.js names all three in NEEDS, and backroom.js
     refuses to render without Preview: a batch runner that cannot show you what it would write
     must not offer to write it. -->
<script src="../shared/themes/resolve.js"></script>
<script src="./device.js?v=16"></script>
<script src="./core.js?v=16"></script>
<script src="./chrome.js?v=16"></script>
<script src="./settings.js?v=16"></script>
<script src="./binder.js?v=16"></script>
<script src="./sheets.js?v=16"></script>
<script src="./picker.js?v=16"></script>
<script src="./enter.js?v=16"></script>
<script src="./summary.js?v=16"></script>
<script src="./batch.js?v=16"></script>
<script src="./preview.js?v=16"></script>
<script src="./backroom.js?v=16"></script>
<script src="./app.js?v=16"></script>
<script src="./boot.js?v=16"></script>
</body>
</html>
