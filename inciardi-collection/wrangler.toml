# Inciardi Collection — worker config
#
# DEPLOY: press the button. Actions → "Deploy inciardi-collection worker" → Run workflow.
# No terminal required; see DEPLOY.md. (At a desk: `npx wrangler deploy` from this folder.)

name = "inciardi-collection"
main = "worker/worker.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "inciardi-collection"
# The live database, holding the schema applied 2026-07-29 and verified 22/22.
# SAFE IN A PUBLIC REPO: a database_id is an IDENTIFIER, not a credential — reaching the
# database still requires the account API token or this worker's binding. Cloudflare's own
# docs commit it in wrangler.toml. Stated rather than assumed, because "it's fine" is not a
# reason.
database_id = "045f1943-dc88-452b-b5d1-f4da81a5a612"

# ============================================================ R2
# Added 2026-08-01 — spec §5 step 6. Gates the image routes and capture; nothing gated it.
#
# THE EXISTING BUCKET, NOT A NEW ONE (Q17a → C). `inciardi-images` already holds 177 objects
# / 268.74MB — Anastasia's scrub renders, which step 12 adopts as `kind='reference'`. The
# reason a second worker may safely bind a bucket another worker also writes to: the market
# app is declared dead, so the two-writer objection dissolved. If market is ever revived, that
# decision has to be re-opened, not inherited.
#
# PREFIX DISCIPLINE: everything this worker writes goes under `ed/<edition_id>/<sha256>.jpg`.
# The 177 legacy objects live outside that prefix, so "ours" and "hers" stay a clean partition
# and step 12 is an adoption rather than a reconciliation. A listing scoped to `ed/` can never
# accidentally enumerate the legacy set.
#
# 🔴 NEVER HARD-DELETE FROM THIS BUCKET. D1 Time Travel covers the database for 30 days and
# covers R2 for nothing at all. Bytes are the only genuinely unrecoverable asset in this app —
# an export carries image ROWS, not image BYTES. Archiving is a `status` flip on the row; the
# object stays. There is deliberately no delete route and there must never be one.
#
# ⚠️ THE DEPLOY IS THE TEST. This worker deploys on CLOUDFLARE_API_TOKEN (Workers scope);
# whether that token can also see R2 is a dashboard fact this repo cannot read, and wrangler
# validates bucket bindings at deploy time. A token without R2 fails the deploy LOUDLY and
# leaves the worker on its current version. Do NOT resolve that by widening the migrate
# workflow's CLOUDFLARE_D1_TOKEN to cover everything — a shared credential makes every
# permission change a change to every consumer, which is exactly what #656 split apart.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "inciardi-images"

# ============================================================ WRITE_KEY
# This block previously read: "WRITE_KEY is deliberately NOT here, and never will be."
# That was true for exactly one day. It is now a plain [vars] entry, below, and the reasoning
# is kept because the reversal is the interesting part.
#
# WHY IT MOVED (2026-07-30, Michael):
#   1. The key is now BAKED INTO THE PUBLIC BUNDLE by decision — `core.js` → DEFAULT_KEY, so
#      Nick and any freshly-cleared browser can write with nothing pasted. Once the string is
#      readable in view-source, encrypting the server's copy of that same string protects
#      nothing. A secret that is already public is not a secret; it is a chore with ceremony.
#   2. A Cloudflare *Secret* CANNOT BE READ BACK. That is precisely how the first one was
#      lost inside a day: the dashboard showed dots, nobody could confirm the value, and
#      checking it against the app meant rotating both halves blind.
#   3. The dashboard step was ALSO unfindable in practice. On 2026-07-30 this worker was live
#      and answering /health while the phone dashboard's application list showed only the two
#      `inciardi-market` workers — so "go set it in the dashboard" was an instruction pointing
#      at a screen that did not show the worker. A setup step nobody can locate is not a step.
#   As a [vars] entry the key deploys FROM GIT with the worker, in one button press, and both
#   halves of the pair are visible in the same repo — which is the only way a mismatch can be
#   spotted rather than guessed at.
#
# ⚠️ THE PAIR MUST MATCH, ALWAYS: this value and `DEFAULT_KEY` in `core.js`. Rotating means
#   editing BOTH in one commit and re-running the deploy workflow. Rotate one and every write
#   returns 401 (core.js names that exact case).
# ⚠️ A [vars] entry OVERWRITES a dashboard secret of the same name on every deploy. So do not
#   "also" set a WRITE_KEY secret in the dashboard expecting it to win — it will be replaced.
#   One source of truth, and it is this file.
# ⚠️ AN UNSET KEY STILL REFUSES EVERY WRITE (worker.js returns 503). Blank never means open.
# ⚠️ THE KEY GATES WRITES, NOT BYTES. Once image routes exist, `GET /image/:id` is an
#   UNAUTHENTICATED read by design (same rule as every other read: the data is which prints
#   Michael owns). The bucket itself stays PRIVATE and is only reachable through the worker —
#   a public bucket would put 268MB behind a URL nobody can rotate.
# ============================================================================
[vars]
WRITE_KEY = "icw_k7Qm4Zt9Rb2Vn6Xw8Ly3Js5Hd4Pg7T"
