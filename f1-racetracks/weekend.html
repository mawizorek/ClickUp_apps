<!DOCTYPE html>
<!--
  F1 Race Weekend (weekend lens) — v19.1 shell.
  Per-round race-weekend detail layer, DECOMPOSED to source modules under source/weekend/.
  styles : source/weekend/base.css   (tokens, topbar, drill-through nav, chrome)
           source/weekend/panels.css (all section styling + animations)
           source/weekend/story.css  (Story mode: Results/Story toggle + replay surface)
           source/chrome-tokens.css  (THE SHARED SPINE — canonical vocabulary, one type
                                      scale, one gutter, brand + switcher styling, and the
                                      FORMS vector: shared/themes/forms.tsv row `sharp`
                                      supplies radius / border-w / elevation / motion, and
                                      every hardcoded radius in the app is repointed at it.
                                      ⚠️ Loaded LAST, but "last" only beats other <link>s —
                                      render.js and module 15 inject CSS at runtime, so the
                                      sweep carries !important. J16 · J17 · J20 · J21.)
  logic  : source/chrome.js          (THE ONE CHROME RENDERER. nav.js used to build the
                                      topbar from a template string — one of three copies of
                                      the same header. This is the only one now, and it
                                      renders nothing when embedded in the unified shell.
                                      Must load BEFORE nav.js, whose boot() calls it. J19.)
           source/08_season.js       (SEASON DERIVATION — the weekend vector + derived round /
                                      status / dates / round pointers, plus the shared colour
                                      vector. SHARED with circuits.html and standings.html.)
           source/weekend/data.js    (store fetch + embed fallback + live swing)
           source/weekend/story.js   (Story mode engine — defines window.mountStory)
           source/weekend/render.js  (section renderers + Results/Story toggle)
           source/weekend/nav.js     (drill-through nav, routing, boot)
  DATA: results derive from the canonical per-round store (f1-results/2026/); the round's
        NUMBER, NAME and DATE derive from the season calendar (season/2026/index_weekends.json)
        via 08_season.js, falling back to the round file's own stored fields when the season
        layer is unreachable. Fails soft to an embedded Canada snapshot off-origin.
  NAV: Weekend is a DRILL-THROUGH, not a peer tab — the switcher is Matrix / History / Circuits
       and none of them is marked current here. Entered from a History card or a Circuit card.
  LOAD ORDER: chrome.js → 08_season.js (window.F1Season) → data.js (globals, awaits it) →
              story.js (window.mountStory) → render.js (uses mountStory) → nav.js (boots).
  🚨 CACHE-BUST: bump every ?v= token below IN THE SAME COMMIT as the change. Three times on
     2026-08-01 a stale token nearly shipped a fix nobody could see.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Weekend · F1 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="source/weekend/base.css?v=21">
<link rel="stylesheet" href="source/weekend/panels.css?v=21">
<link rel="stylesheet" href="source/weekend/story.css?v=21">
<!-- LAST on purpose — but "last" only beats other <link> elements; see the note above. -->
<link rel="stylesheet" href="source/chrome-tokens.css?v=21">
</head>
<body>
  <div id="topbar"></div>
  <div id="wknav"></div>
  <div id="mast"></div>
  <div id="app"></div>
  <footer>
    <span>Race Weekend <b class="num" id="foot-stamp">v6</b> · derived from results store</span>
    <span class="num">f1-results/2026/</span>
  </footer>
  <script src="source/chrome.js?v=21"></script>
  <script src="source/08_season.js?v=21"></script>
  <script src="source/weekend/data.js?v=21"></script>
  <script src="source/weekend/story.js?v=21"></script>
  <script src="source/weekend/render.js?v=21"></script>
  <script src="source/weekend/nav.js?v=21"></script>
</body>
</html>
