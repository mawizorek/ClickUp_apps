<!DOCTYPE html>
<!-- INFRASTRUCTURE: slim loader shell. SEGMENTED app: styling in source/standings/*.css, logic in source/standings/*.js. Every file under the 12KB soft cap. Never inline this back into one file. -->
<!-- DATA: results come from the canonical per-round store at ./f1-results/2026/ (index_rounds.json + round files). The CALENDAR (round number, name, date, how many rounds the season has) comes from season/2026/index_weekends.json via source/08_season.js. No data duplicated here. -->
<!-- v6.1: nav model — Weekend is a per-round drill-through, switcher is Matrix / History / Circuits. -->
<!-- v6.3: cohesion pass — standings palette + ease unified to the shared hue-268 system. STRUCK 2026-08-01: this line also claimed a "shared F1 brand lockup added to the nav appbar" and it was never added. The .brand rule pointed at an element that did not exist on this page for six versions. Real as of v17. -->
<!-- v6.4: matrix density — row/header/type/team-bar/WCC tightened so more drivers show per screen. -->
<!-- v6.5: seamless cross-lens nav — cross-document View Transitions (cross-fade instead of hard reload). STRUCK 2026-08-01: also claimed a "persistent F1 brand morph shared with the circuits lens." There was no brand element to morph, so the transition always cross-faded the whole page. Real as of v17. -->
<!-- v10 (history feed): history.js restyled into a social/activity feed (timeline + post cards, no side-stripe). -->
<!-- v6.7: driver popup race-pace strip reads REAL per-driver fastLap {time,lap} from the store (backfilled r1-9) with the lap number + round-FL purple pip. -->
<!-- v13 (2026-08-01): SEASON LAYER. source/08_season.js loads FIRST and gives this surface the derived calendar — round numbers, names, dates and the season length — so nothing time-shaped is read out of a round file any more. Fixes a dead NaN sort left by v11 and a hardcoded "/ 22" that went wrong when the season became 23 rounds. -->
<!-- v17 (2026-08-01): CHROME SPINE. source/chrome-tokens.css loads LAST and carries the canonical token vocabulary, one type scale, one page gutter, and the brand + switcher styling shared with the other two surfaces. Decision Log J16 + J17. -->
<!-- v18 (2026-08-01): ONE CHROME RENDERER. The hand-written .mast-top header v17 added here is GONE — replaced by <div data-chrome>, which source/chrome.js fills. That module is the ONLY place the brand + switcher markup exists in this app, and it renders NOTHING when embedded in the unified shell. Decision Log J18 + J19. -->
<!-- v19 (2026-08-01): THE FORMS VECTOR. chrome-tokens.css carries shared/themes/forms.tsv row `sharp` (radius / border-w / elevation / motion) and repoints every hardcoded radius at it. ⚠️ This surface had NO radii of its own — it read as "sharp" only because nobody ever typed one. It is sharp on purpose now. Decision Log J20. -->
<!-- ⚠️ v19.1 (2026-08-01): CASCADE FIX. history.js and nav.js build their CSS at RUNTIME and document.head.appendChild it, so their literals landed AFTER chrome-tokens.css and won on document order — .hx-post stayed 10px with the sweep already merged. The sweep is !important now. If you add a runtime-injected style block to this page, know that it outranks the shared spine unless the spine flags it. Decision Log J21. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17171d">
<title>2026 F1 Championship Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;450;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="source/standings/base.css?v=21">
<link rel="stylesheet" href="source/standings/panel.css?v=21">
<!-- LAST on purpose — but note that "last" only beats other <link> elements. The runtime
     injectors in history.js / nav.js still land after this; section 8 uses !important. -->
<link rel="stylesheet" href="source/chrome-tokens.css?v=21">
<style>
  html{background:oklch(0.16 0.012 268)}
</style>
</head>
<body>
  <header class="mast">
    <!-- Filled by source/chrome.js. Empty when embedded in the unified shell — the shell
         owns the chrome there, and the renderer knows it without being told. -->
    <div class="mast-top" data-chrome data-lens="matrix"></div>
    <div>
      <span class="eyebrow">FIA Formula 1 World Championship</span>
      <h1>2026 Season <b>/</b> Points Matrix</h1>
    </div>
    <div class="leader-strip" id="leaderStrip"></div>
  </header>

  <div class="controls">
    <div class="seg" role="tablist" aria-label="View">
      <button role="tab" aria-selected="true" data-view="drivers">Drivers Matrix</button>
      <button role="tab" aria-selected="false" data-view="constructors">Constructors</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="sw win">1</i> Win</span>
      <span><i class="dot fl"></i> Fastest lap</span>
      <span><i class="sw story"></i> Story</span>
      <span><i class="sw mv"></i> Mover</span>
    </div>
  </div>

  <div id="stage">
    <div class="state"><span class="sp"></span><br>Loading the 2026 season&hellip;</div>
  </div>

  <footer>
    <span>Championship Matrix <span class="num" id="stamp">v6.7</span></span>
    <span>canonical store</span>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-label="Profile"></aside>

  <script src="source/chrome.js?v=21"></script>
  <script src="source/08_season.js?v=21"></script>
  <script src="source/standings/data.js?v=21"></script>
  <script src="source/standings/matrix.js?v=21"></script>
  <script src="source/standings/trajectory.js?v=21"></script>
  <script src="source/standings/panel.js?v=21"></script>
  <script src="source/standings/nav.js?v=21"></script>
  <script src="source/standings/history.js?v=21"></script>
</body>
</html>
