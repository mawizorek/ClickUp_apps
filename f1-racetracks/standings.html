<!DOCTYPE html>
<!-- INFRASTRUCTURE: slim loader shell. SEGMENTED app: styling in source/standings/*.css, logic in source/standings/*.js. Every file under the 12KB soft cap. Never inline this back into one file. -->
<!-- DATA: results come from the canonical per-round store at ./f1-results/2026/ (index_rounds.json + round files). The CALENDAR (round number, name, date, how many rounds the season has) comes from season/2026/index_weekends.json via source/08_season.js. No data duplicated here. -->
<!-- v6.1: nav model — Weekend is a per-round drill-through, switcher is Matrix / History / Circuits. -->
<!-- v6.3: cohesion pass — standings palette + ease unified to the shared hue-268 system. STRUCK 2026-08-01: this line also claimed a "shared F1 brand lockup added to the nav appbar" and it was never added. The .brand rule below pointed at an element that did not exist on this page for six versions. Fixed in v17. -->
<!-- v6.4: matrix density — row/header/type/team-bar/WCC tightened so more drivers show per screen. ?v bumped across modules. -->
<!-- v6.5: seamless cross-lens nav — cross-document View Transitions (cross-fade instead of hard reload). STRUCK 2026-08-01: also claimed a "persistent F1 brand morph shared with the circuits lens." There was no brand element to morph, so the transition always cross-faded the whole page — which is exactly why this lens felt like a different app. Real as of v17. -->
<!-- v10 (history feed): history.js restyled into a social/activity feed (timeline + post cards, no side-stripe). Module + css ?v bumped 6.5 -> 6.6 so clients refetch; footer stamp -> v6.6. -->
<!-- v6.7: driver popup race-pace strip now reads REAL per-driver fastLap {time,lap} from the store (backfilled r1-9) with the lap number + round-FL purple pip; stale illustrative note refreshed. panel.js ?v 6.6 -> 6.7; footer stamp -> v6.7. -->
<!-- v13 (2026-08-01): SEASON LAYER. source/08_season.js loads FIRST and gives this surface the derived calendar — round numbers, names, dates and the season length — so nothing time-shaped is read out of a round file any more. Fixes a dead NaN sort left by v11 and a hardcoded "/ 22" that went wrong when the season became 23 rounds. All module ?v tokens bumped to 13. -->
<!-- v17 (2026-08-01): CHROME SPINE. source/chrome-tokens.css loads LAST and carries the canonical token vocabulary, one type scale, one page gutter, and the brand lockup + lens switcher shared with the other two surfaces. The masthead gains the missing .brand element, so the f1-brand view transition finally has something to morph. Decision Log J16 + J17. -->
<!-- ⚠️ v17.1 (2026-08-01): THE .mast-top ROW BELOW IS STANDALONE CHROME. Embedded in the unified shell (index.html), the SHELL owns the brand + switcher, so .mast-top is hidden by chrome-tokens.css section 6 AND by app-shell.js's EMBED_CSS. v17 added this row without either, and the shell rendered two brands and two switchers stacked. If you add chrome to this page, hide it in both places. Decision Log J18. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17171d">
<title>2026 F1 Championship Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;450;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="source/standings/base.css?v=18">
<link rel="stylesheet" href="source/standings/panel.css?v=18">
<!-- LAST on purpose: the shared spine wins the cascade over this surface's own :root,
     which is how three chromes get unified without retyping two 11.5KB stylesheets. -->
<link rel="stylesheet" href="source/chrome-tokens.css?v=18">
<style>
  html{background:oklch(0.16 0.012 268)}
</style>
</head>
<body>
  <header class="mast">
    <div class="mast-top">
      <a class="brand" href="./circuits.html" aria-label="F1 Racetracks home">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M3 17c4-1 6-9 10-9 3 0 4 3 8 2" stroke="white" stroke-width="2.4" stroke-linecap="round"></path><circle cx="6" cy="16.5" r="1.7" fill="white"></circle></svg></span>
        <span class="t">F1 Racetracks<small>2026 Season</small></span>
      </a>
      <nav class="lens" aria-label="Lens switcher">
        <span class="on" aria-current="page">Matrix</span>
        <a href="./standings.html#history">History</a>
        <a href="./circuits.html">Circuits</a>
      </nav>
    </div>
    <div>
      <span class="eyebrow">FIA Formula 1 World Championship</span>
      <h1>2026 Season <b>/</b> Points Matrix</h1>
    </div>
    <div class="leader-strip" id="leaderStrip"></div>
  </header>

  <div class="controls">
    <div class="seg" role="tablist" aria-label="View">
      <button role="tab" aria-selected="true" data-view="drivers">Drivers Matrix</button>
      <button role="tab" aria-selected="false" data-view="constructors">Constructors</button>
    </div>
    <div class="legend" id="legend">
      <span><i class="sw win">1</i> Win</span>
      <span><i class="dot fl"></i> Fastest lap</span>
      <span><i class="sw story"></i> Story</span>
      <span><i class="sw mv"></i> Mover</span>
    </div>
  </div>

  <div id="stage">
    <div class="state"><span class="sp"></span><br>Loading the 2026 season&hellip;</div>
  </div>

  <footer>
    <span>Championship Matrix <span class="num" id="stamp">v6.7</span></span>
    <span>canonical store</span>
  </footer>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-label="Profile"></aside>

  <script src="source/08_season.js?v=18"></script>
  <script src="source/standings/data.js?v=18"></script>
  <script src="source/standings/matrix.js?v=18"></script>
  <script src="source/standings/trajectory.js?v=18"></script>
  <script src="source/standings/panel.js?v=18"></script>
  <script src="source/standings/nav.js?v=18"></script>
  <script src="source/standings/history.js?v=18"></script>
</body>
</html>
