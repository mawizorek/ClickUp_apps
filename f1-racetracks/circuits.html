<!--
  F1 Racetracks (circuit guide lens)
  Version: v19.1 (shell) · forms vector (sharp) + one chrome renderer + shared token spine
  Live: https://mawizorek.github.io/ClickUp_apps/f1-racetracks/circuits.html
  Source: https://github.com/mawizorek/ClickUp_apps/tree/main/f1-racetracks
  INFRASTRUCTURE: slim runtime entrypoint + direct source modules in /source.
  RESULTS: podium/pole/fastest-lap derive live from the canonical store
  (f1-results/2026/) via source/12_results_store.js.
  DATA (2026-08-01): THREE VECTORS, kept separate and derived.
    · CIRCUITS  — circuits/<slug>.json, TIMELESS identity + layout only.
                  circuits/index_circuits.json is a plain slug -> file map.
    · WEEKENDS  — season/2026/index_weekends.json, the per-year join. One row per RACE
                  WEEKEND: which circuit, which session dates, sprint or not, cuTaskId.
    · RESULTS   — f1-results/2026/, a manifest of rounds that have actually been raced.
  Round number, weekend status, the display date and the current/last round pointers are
  NOT STORED ANYWHERE — source/08_season.js derives them all from the session dates at boot,
  so a mid-season cancellation or insertion self-heals.
  COLOUR (v16): 08_season.js also reads shared/themes/colors.tsv and injects --t-<team>,
  --t-<team>-2 and --t-<team>-deep onto :root, so team colour has ONE source across the app
  and a two-stop team gradient is expressible. Edit the TSV row, every surface follows.
  CHROME (v17 + v18): source/chrome-tokens.css is the shared TOKEN spine and source/chrome.js
  is the one RENDERER. The brand and lens switcher used to be hand-written in this file; they
  are now a <div data-chrome> mount, and that module is the only place the markup exists in
  the app. It draws nothing when embedded in the unified shell.
  FORMS (v19): chrome-tokens.css carries shared/themes/forms.tsv row `sharp` — radius,
  border-w, gradient angle, the elevation scale and the motion set — and repoints every
  hardcoded radius in the app at it. ⚠️ THIS LENS WAS THE ROUND ONE: its cards were 7px, its
  filter bar 9px, its weekend card 20px, all hand-typed. Corners are 4px from the grid now.
  To change the whole app's feel, swap the row in forms.tsv; do NOT type a radius here.

  🔴 CASCADE (v19.1) — THIS LENS IS THE WORST CASE, KNOW IT BEFORE YOU STYLE ANYTHING.
  Its ENTIRE style band (02..07) is FETCHED AND APPENDED AT RUNTIME by the script below, and
  source/09 injects a further block (#v9-circuits-css) on top of that. Both land AFTER
  chrome-tokens.css has parsed, so at equal specificity they WIN on document order — nothing
  in this lens was ever reachable by plain link-order override. That is why the cards stayed
  7px with v19 already merged and Michael said "something is still not connected properly."
  The shared spine's radius sweep carries !important for exactly this reason. Decision Log J21.

  DESIGN SYSTEM: Chakra Petch / JetBrains Mono / Inter + shared oklch (hue 268).
  v7: runs under the unified shell (index.html); chrome.js suppresses this page's own
  header when embedded (the shell owns it).
  v8: source/09 replaced the Jump-to-circuit <select> with a styled side drawer and
  reworked the home cards to a database feel.
  v9: source/09 culls the marketing hero and adds a top-level filter bar (Continent /
  Era / Status / Breakdown).
  ⚠️ DO NOT REMOVE <select id="jump">. source/09's setupJump() finds it by id and REPLACES
  it with the drawer trigger via parentNode.replaceChild. If it is absent that function
  returns SILENTLY and the drawer never builds — no error, no drawer. Baseline finding #1.
  🚨 CACHE-BUST: bump BUILD_STAMP AND every ?v= token IN THE SAME COMMIT as the change. This
  file read 20260801a through v12, v13, v14, v15 AND v16 — five versions behind one token,
  which is how a phone ends up looking at last week's bundle.
  Footer version label lives in source/09 (APP_VERSION). Keep it in sync with this header.
-->
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>F1 Racetracks</title>
  <link rel="icon" type="image/png" href="https://app-cdn.clickup.com/assets/favicons/favicon-16x16.png" sizes="16x16">
  <link rel="icon" type="image/png" href="https://app-cdn.clickup.com/assets/favicons/favicon-32x32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;450;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
  <style>
    html{background:oklch(0.16 0.012 268)}
    #app,footer.app{opacity:0}
    body.runtime-ready #app,body.runtime-ready footer.app{opacity:1;transition:opacity .22s cubic-bezier(0.16,1,0.3,1)}
    /* FIRST-PAINT FLOOR ONLY. The canonical vocabulary is --txt / --txt-mid / --s1 / --s2 /
       --s3 in source/chrome-tokens.css, which loads after this block and aliases these
       names onto it. Every value here was verified byte-identical to its canonical twin
       before the aliases were written, so nothing shifts colour. Do not add tokens here,
       and do NOT add a radius — corners come from the forms vector (chrome-tokens §7). */
    :root{
      --bg:oklch(0.16 0.012 268);--bg2:oklch(0.195 0.014 268);
      --surface:oklch(0.225 0.015 268);--surface2:oklch(0.265 0.016 268);
      --line:oklch(0.30 0.014 268);--text:oklch(0.95 0.006 268);
      --muted:oklch(0.74 0.011 268);--faint:oklch(0.56 0.013 268);
      --red:oklch(0.64 0.21 26);--ease:cubic-bezier(0.16,1,0.3,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;font-weight:450;background:var(--bg);color:var(--text);line-height:1.55;letter-spacing:0.006em;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;padding-top:clamp(16px,3vw,40px);min-height:100vh}
    .wrap{max-width:1200px;margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px}
    .topbar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    /* When chrome.js suppresses the header (embedded), the mount is empty and the flex row
       would still reserve its gap. Collapsing it keeps the jump control flush right. */
    .topbar [data-chrome][data-chrome-state="embedded"]{display:none}
    .nav-jump{display:flex;align-items:center;gap:8px}
    /* v19: was `border:1px solid` + `border-radius:9px`, both hand-typed. This is the one
       radius literal in the app small enough to delete at source instead of override. */
    .nav-jump select{font-family:'JetBrains Mono',monospace;font-size:.74rem;background:var(--surface);color:var(--text);border:var(--border-w,1px) solid var(--line);border-radius:var(--radius,4px);padding:8px 11px;cursor:pointer;max-width:60vw}
  </style>
  <!-- LAST of the <link>s — but the style band below is appended at RUNTIME and lands after
       this, which is why the shared spine's radius sweep needs !important. See the header. -->
  <link rel="stylesheet" href="./source/chrome-tokens.css?v=20260801e">
  <script>
    // Bump this one token on every source/style deploy to guarantee fresh bytes.
    const BUILD_STAMP = '20260801e';
    const RUNTIME_STYLE_SOURCES = [
      './source/02_styles_foundation_and_layout.css.txt',
      './source/03_styles_panels_tables_footer.css.txt',
      './source/04_styles_results_and_mobile.css.txt',
      './source/05_styles_live_session_panel.css.txt',
      './source/06_styles_technical_index.css.txt',
      './source/07_styles_lens_switcher.css.txt'
    ];

    window.runtimeStylesReady = Promise.all(
      RUNTIME_STYLE_SOURCES.map(async (path) => {
        const res = await fetch(path + '?v=' + BUILD_STAMP, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Failed to load ${path}`);
        const style = document.createElement('style');
        style.dataset.source = path;
        style.textContent = await res.text();
        document.head.appendChild(style);
      })
    ).catch((err) => {
      console.error('Runtime style load failed', err);
    }).finally(() => {
      document.body.classList.add('runtime-ready');
    });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <!-- Filled by source/chrome.js — the ONE place the brand + switcher markup lives.
           Empty when embedded in the unified shell; the renderer detects that itself. -->
      <div data-chrome data-lens="circuits" data-brand-href="#/" data-sub="2026 Circuit Guide"></div>
      <div class="topbar-r">
        <div class="nav-jump">
          <!-- ⚠️ source/09 REPLACES this element by id. Remove it and the jump drawer
               silently never builds. See the header note. -->
          <select id="jump" aria-label="Jump to circuit"><option value="">Jump to circuit…</option></select>
        </div>
      </div>
    </div>

    <div id="app"></div>

    <footer class="app">
      <span class="meta-txt" id="foot-meta">F1 Racetracks v19.1 · loading data…</span>
      <div class="toolbar">
        <a class="tool" href="./live-tracker.html">Live tracker</a>
      </div>
    </footer>
  </div>

  <script src="./source/chrome.js?v=20260801e"></script>
  <script src="./source/08_season.js?v=20260801e"></script>
  <script src="./source/12_results_store.js?v=20260801e"></script>
  <script src="./source/09_app_bootstrap_and_home.js?v=20260801e"></script>
  <script src="./source/10_track_views_and_profile.js?v=20260801e"></script>
  <script src="./source/13_live_session_panel.js?v=20260801e"></script>
  <script src="./source/11_weather_and_footer_exports.js?v=20260801e"></script>
  <script src="./source/14_weekend_state_and_data.js?v=20260801e"></script>
  <script src="./source/15_weekend_surface_render.js?v=20260801e"></script>
  <script src="./source/16_weekend_live_mode.js?v=20260801e"></script>
  <script src="./source/17_weekend_mount.js?v=20260801e"></script>
  <script src="./source/18_home_and_mobile_polish.js?v=20260801e"></script>
</body>
</html>
